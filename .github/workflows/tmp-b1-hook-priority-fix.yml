name: Temporary B1 hook priority fixer

on:
  push:
    branches:
      - fix/php-audit-b1-hook-graph-20260902

permissions:
  contents: write

jobs:
  apply-exact-hook-priority-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact fail-closed replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('wp-content/themes/nuvanx-medical/inc/nvx-content-presentation.php'): [
                  ("add_filter( 'the_content', 'nvx_content_presentation_enhance', 20 );", "add_filter( 'the_content', 'nvx_content_presentation_enhance', NVX_HOOK_PRIO_PRESENTATION_ENHANCE );"),
                  ("add_filter( 'the_content', 'nvx_content_inject_global_treatment_sections', 21 );", "add_filter( 'the_content', 'nvx_content_inject_global_treatment_sections', NVX_HOOK_PRIO_GLOBAL_TREATMENT );"),
                  ("add_filter( 'the_content', 'nvx_content_strip_page_closing_ctas_late', 99 );", "add_filter( 'the_content', 'nvx_content_strip_page_closing_ctas_late', NVX_HOOK_PRIO_STRIP_PAGE_CTAS );"),
              ],
              Path('wp-content/themes/nuvanx-medical/inc/nvx-authentic-page-photography.php'): [
                  ("add_filter( 'the_content', 'nvx_append_authentic_page_photography', 175 );", "add_filter( 'the_content', 'nvx_append_authentic_page_photography', NVX_HOOK_PRIO_AUTHENTIC_PHOTOGRAPHY );"),
              ],
              Path('wp-content/themes/nuvanx-medical/inc/nvx-gbp-local.php'): [
                  ("add_filter( 'the_content', 'nvx_public_strip_vendor_images', 198 );", "add_filter( 'the_content', 'nvx_public_strip_vendor_images', NVX_HOOK_PRIO_PUBLIC_VENDOR_IMAGES );"),
                  ("add_filter( 'the_content', 'nvx_clinic_strip_vendor_packshots', 199 );", "add_filter( 'the_content', 'nvx_clinic_strip_vendor_packshots', NVX_HOOK_PRIO_CLINIC_VENDOR_PACKSHOTS );"),
              ],
              Path('wp-content/themes/nuvanx-medical/inc/nvx-native-style-governance.php'): [
                  ("add_filter( 'the_content', 'nvx_theme_normalize_managed_component_prose_wrapper', PHP_INT_MAX );", "add_filter( 'the_content', 'nvx_theme_normalize_managed_component_prose_wrapper', NVX_HOOK_PRIO_MANAGED_COMPONENT_PROSE_WRAPPER );"),
              ],
          }

          changed = 0
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
                  changed += 1
              if text == original:
                  raise SystemExit(f'{path}: replacement set produced no change')
              path.write_text(text, encoding='utf-8')

          if changed != 7:
              raise SystemExit(f'Expected 7 replacements, applied {changed}')
          print(f'Applied {changed} exact replacements')

      - name: Verify old priorities are absent and constants are present
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RFn "add_filter( 'the_content', 'nvx_content_presentation_enhance', 20 );" wp-content/themes/nuvanx-medical/inc
          ! grep -RFn "add_filter( 'the_content', 'nvx_content_inject_global_treatment_sections', 21 );" wp-content/themes/nuvanx-medical/inc
          ! grep -RFn "add_filter( 'the_content', 'nvx_content_strip_page_closing_ctas_late', 99 );" wp-content/themes/nuvanx-medical/inc
          ! grep -RFn "add_filter( 'the_content', 'nvx_append_authentic_page_photography', 175 );" wp-content/themes/nuvanx-medical/inc
          ! grep -RFn "add_filter( 'the_content', 'nvx_public_strip_vendor_images', 198 );" wp-content/themes/nuvanx-medical/inc
          ! grep -RFn "add_filter( 'the_content', 'nvx_clinic_strip_vendor_packshots', 199 );" wp-content/themes/nuvanx-medical/inc
          ! grep -RFn "add_filter( 'the_content', 'nvx_theme_normalize_managed_component_prose_wrapper', PHP_INT_MAX );" wp-content/themes/nuvanx-medical/inc
          grep -Fq 'NVX_HOOK_PRIO_AUTHENTIC_PHOTOGRAPHY' wp-content/themes/nuvanx-medical/inc/nvx-constants.php
          grep -Fq 'NVX_HOOK_PRIO_PUBLIC_VENDOR_IMAGES' wp-content/themes/nuvanx-medical/inc/nvx-constants.php
          grep -Fq 'NVX_HOOK_PRIO_CLINIC_VENDOR_PACKSHOTS' wp-content/themes/nuvanx-medical/inc/nvx-constants.php
          grep -Fq 'NVX_HOOK_PRIO_MANAGED_COMPONENT_PROSE_WRAPPER' wp-content/themes/nuvanx-medical/inc/nvx-constants.php
          git diff --check

      - name: Commit exact replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NUVANX Audit Bot'
          git config user.email 'bot@nuvanx.com'
          git add \
            wp-content/themes/nuvanx-medical/inc/nvx-content-presentation.php \
            wp-content/themes/nuvanx-medical/inc/nvx-authentic-page-photography.php \
            wp-content/themes/nuvanx-medical/inc/nvx-gbp-local.php \
            wp-content/themes/nuvanx-medical/inc/nvx-native-style-governance.php
          git diff --cached --quiet && { echo 'No staged changes'; exit 1; }
          git commit -m 'fix(hooks): eliminate remaining magic the_content priorities (#1005)'
          git push origin "HEAD:${{ github.ref_name }}"
