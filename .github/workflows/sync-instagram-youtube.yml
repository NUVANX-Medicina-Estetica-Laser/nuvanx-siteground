name: "Sync Instagram Reels to YouTube"

on:
  schedule:
    # Runs daily at 08:00 UTC (10:00 Madrid time)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Instagram to YouTube Sync Engine
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          node scripts/seo/sync-instagram-to-youtube.mjs

      - name: Commit sync state if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/instagram_videos/sync-state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(sync): update instagram to youtube sync state [skip ci]"
          git push origin master || echo "No changes to push"
