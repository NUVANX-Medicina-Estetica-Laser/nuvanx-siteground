name: Staging
run-name: >-
  Staging · ${{ github.event_name == 'pull_request_target' && format('PR #{0}', github.event.pull_request.number) || (github.event_name == 'workflow_dispatch' && 'manual' || github.sha) }}

on:
  push:
    branches: [master]
    paths:
      - 'wp-content/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - '.gitleaks.toml'
      - '.gitleaksignore'
  pull_request:
    branches: [master]
  pull_request_target:
    branches: [master]
    types: [labeled]
  schedule:
    # Weekly audit on Sundays at 00:00 UTC (runs quality & full-history secret scan only)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      sha:
        description: Optional full master-contained SHA. Blank uses the triggering SHA.
        required: false
        type: string
      run_acceptance:
        description: Run the production-eligible Block C browser acceptance after deployment.
        required: true
        default: true
        type: boolean
      deep_quality:
        description: Also run PHPCS and PHPStan.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run and may replace an
# older pending SHA. Every mutating run therefore gets its own group; the FIFO
# lease below provides the cross-workflow serialization without cancelling SHAs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nuvanx-quality-{0}', github.event.pull_request.number) || format('nuvanx-mutation-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  STAGING_ROOT: /home/customer/www/staging2.nuvanx.com/public_html
  STAGING_PARENT: /home/customer/www/staging2.nuvanx.com
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  STAGING_URL: https://staging2.nuvanx.com
  SSH_RETRY_ATTEMPTS: 5
  SSH_RETRY_BASE_DELAY_SECONDS: 15
  SSH_TRANSPORT_EXIT_CODE: 255
  CI: true

jobs:
  quality:
    name: Static quality and repository integrity
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha) }}
          fetch-depth: 0
          persist-credentials: false
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Enforce repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t transient < <(git ls-files | grep -E '(^|/)(tmp|temp)[_-]|(-(once|temp)\.(yml|yaml|sh|mjs)$)' || true)
          if (( ${#transient[@]} > 0 && ${#transient[0]} > 0 )); then
            printf 'Transient files are forbidden:\n%s\n' "${transient[*]}" >&2
            exit 1
          fi

          offenders=()
          while IFS= read -r file; do
            grep -Eq '(^|[[:space:]])git[[:space:]]+push([[:space:]]|$)' "$file" && offenders+=("$file") || true
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          (( ${#offenders[@]} == 0 )) || { printf 'Workflow self-mutation forbidden: %s\n' "${offenders[*]}" >&2; exit 1; }

          forbidden=(DEPLOY_TRIGGER.txt composer.phar wp-content/themes/nuvanx-medical/composer.phar)
          for file in "${forbidden[@]}"; do
            ! git ls-files --error-unmatch "$file" >/dev/null 2>&1 || { echo "Tracked generated file: $file" >&2; exit 1; }
          done
          for prefix in .vscode/ audit/ .github/audit/ wp-content/themes/nuvanx-medical/vendor/; do
            ! git ls-files | grep -Fq "$prefix" || { echo "Tracked generated prefix: $prefix" >&2; exit 1; }
          done

          while IFS= read -r file; do
            [[ -f "$file" && -s "$file" ]] || { echo "Empty tracked file: $file" >&2; exit 1; }
            case "$file" in *.orig|*.rej|*.bak|*.tmp|*.swp|*~|*/.DS_Store|.DS_Store) echo "Editor residue: $file" >&2; exit 1 ;; esac
          done < <(git ls-files)

          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          if [[ "${workflows[*]}" != 'gemini-pr-reviewer.yml production.yml staging.yml' ]]; then
            printf 'Exactly three canonical workflows are required; found: %s\n' "${workflows[*]}" >&2
            exit 1
          fi
          echo 'REPOSITORY_HYGIENE=PASS workflows=3'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: composer

      - name: Run blocking static gates
        shell: bash
        env:
          ENDOLASER_APPROVAL_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
        run: |
          set -euo pipefail
          find wp-content/themes/nuvanx-medical -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          find tools/migrations lib -name '*.php' -type f -print0 | xargs -0 -r -n1 php -l >/dev/null
          php scripts/lint/test-clinical-matrix-ownership.php
          php scripts/lint/test-seo-catalog-ownership.php
          php scripts/lint/test-seo-governed-metadata.php
          php scripts/lint/test-publication-robots-reconciliation.php
          php scripts/lint/test-governed-blog-request-contract.php
          php scripts/lint/test-priority-landing-contract.php
          php scripts/lint/test-valoracion-direct-form-contract.php
          node scripts/lint/test-single-hubspot-mount.mjs
          node scripts/staging2/test-console-error-classifier.mjs
          find wp-content/themes/nuvanx-medical -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check >/dev/null
          node scripts/lint/no-hardcoded-colors.mjs --strict
          node scripts/lint/no-hardcoded-fontsize.mjs
          node scripts/lint/no-inline-layout-styles.mjs
          node scripts/lint/validate-rendered-prices.mjs
          node scripts/lint/test-schema-semantic-contract.mjs
          node scripts/lint/test-endolaser-claim-approval.mjs
          schema='wp-content/themes/nuvanx-medical/inc/data/routes.schema.json'
          data='wp-content/themes/nuvanx-medical/inc/data/routes.json'
          if [[ -f "$schema" && -f "$data" ]]; then node scripts/lint/validate-routes-schema.mjs "$schema" "$data"; fi
          bash -n tools/deploy/deploy-to-staging2.sh
          bash -n scripts/ci/wait-for-environment-mutation-turn.sh
          bash -n scripts/ci/verify-staging-acceptance.sh
          bash -n scripts/ci/test-mutation-fifo-contract.sh
          bash -n tools/remote-compare.sh
          bash scripts/ci/test-mutation-fifo-contract.sh
          find scripts/staging2 -maxdepth 1 -name '*.mjs' -type f -print0 | xargs -0 -r -n1 node --check
          npm audit --prefix scripts/seo --audit-level=high >/dev/null
          echo 'STATIC_GATES=PASS'

      - name: Run deep PHP quality gates
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_quality }}
        shell: bash
        run: |
          set -euo pipefail
          cd wp-content/themes/nuvanx-medical
          composer install --no-interaction --no-progress --prefer-dist
          ./vendor/bin/phpcs --standard=phpcs.xml.dist --report=full -s
          ./vendor/bin/phpstan analyse --configuration=phpstan.neon --error-format=table --no-progress --memory-limit=1G

      - name: Scan committed history for secrets
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.0"
          GITLEAKS_TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_SHA256="cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4"
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --connect-timeout 10 --max-time 60 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_TAR}" -o "$RUNNER_TEMP/$GITLEAKS_TAR"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$GITLEAKS_TAR" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$GITLEAKS_TAR" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

          log_opts=""
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            log_opts="--diff-merges=first-parent origin/master..HEAD"
          elif [[ "${{ github.event_name }}" == 'push' && "${{ github.event.before }}" != '0000000000000000000000000000000000000000' ]]; then
            before_sha="${{ github.event.before }}"
            if git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              log_opts="--diff-merges=first-parent ${before_sha}..${{ github.event.after }}"
            else
              echo "Base commit $before_sha is unreachable (e.g. after force-push/rewrite); falling back to full history scan."
            fi
          fi

          if [[ -n "$log_opts" ]]; then
            echo "Scanning commit range: $log_opts"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --log-opts="$log_opts" --redact --verbose
          else
            echo "Scanning entire git commit history"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose
          fi

  deploy_staging_runners:
    name: Staging SSH runner ${{ matrix.runner_attempt }}/3
    permissions:
      contents: read
      actions: write
      pull-requests: read
    needs: quality
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        runner_attempt: [1, 2, 3]
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha }}
      RUN_ACCEPTANCE: ${{ github.event_name == 'push' || inputs.run_acceptance }}
      RUNNER_ATTEMPT_NO: ${{ matrix.runner_attempt }}
    steps:
      - name: Check for completion by an earlier fresh runner
        id: prior_completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo 'Candidate must be a full lowercase 40-character SHA.' >&2; exit 1; }
          artifact_name="staging2-deploy-complete-${candidate}"
          response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${artifact_name}&per_page=100")"
          count="$(printf '%s' "$response" | jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
          if (( count > 0 )); then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
            echo "STAGING_FRESH_RUNNER=SKIP already_complete artifact=$artifact_name"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out master history
        if: ${{ steps.prior_completion.outputs.complete != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for FIFO environment mutation turn
        if: ${{ steps.prior_completion.outputs.complete != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_ROLE: staging
          MUTATION_CANCEL_SUPERSEDED_STAGING: '1'
          MUTATION_WAIT_MAX_SECONDS: 5400
        run: bash scripts/ci/wait-for-environment-mutation-turn.sh

      - name: Resolve immutable candidate
        if: ${{ steps.prior_completion.outputs.complete != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Candidate must be a full lowercase 40-character SHA.' >&2; exit 1; }
          git fetch --no-tags origin master
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/master || { echo 'Refusing SHA outside origin/master.' >&2; exit 1; }
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: ${{ steps.prior_completion.outputs.complete != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Configure strict Staging2 SSH and classify preflight
        id: ssh_preflight
        if: ${{ steps.prior_completion.outputs.complete != 'true' }}
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?Missing STAGING2_SSH_HOST}"; : "${USER:?Missing STAGING2_SSH_USER}"; : "${KEY:?Missing STAGING2_SSH_PRIVATE_KEY}"; : "${KH:?Missing STAGING2_SSH_KNOWN_HOSTS}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging_key"; chmod 600 "$HOME/.ssh/staging_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'STAGING_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"

          ssh_err="$RUNNER_TEMP/staging-ssh-preflight.err"
          : > "$ssh_err"
          set +e
          ssh -n nvx-staging2 "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v rsync >/dev/null && command -v php >/dev/null" 2>"$ssh_err"
          ssh_rc=$?
          set -e

          if [[ "$ssh_rc" -eq 0 ]]; then
            echo 'connected=true' >> "$GITHUB_OUTPUT"
            echo 'transport_retry=false' >> "$GITHUB_OUTPUT"
            echo 'status=pass' >> "$GITHUB_OUTPUT"
            echo 'STAGING_SSH=PASS'
            exit 0
          fi

          cat "$ssh_err" >&2 || true
          status='ssh_other'
          transport_retry='false'
          if [[ "$ssh_rc" -ne 255 ]]; then
            status='remote_env'
          elif grep -Eqi 'Connection timed out|Operation timed out|Connection refused|Connection reset by peer|No route to host|Network is unreachable|Could not resolve hostname|Temporary failure in name resolution|Name or service not known|kex_exchange_identification:.*(Connection closed|Connection reset)|Connection closed by .* port' "$ssh_err"; then
            status='transport'
            transport_retry='true'
          elif grep -Eqi 'Permission denied|Authentication failed|Too many authentication failures|No more authentication methods to try' "$ssh_err"; then
            status='auth'
          elif grep -Eqi 'Host key verification failed|REMOTE HOST IDENTIFICATION HAS CHANGED|No .* host key is known' "$ssh_err"; then
            status='hostkey'
          fi

          echo 'connected=false' >> "$GITHUB_OUTPUT"
          echo "transport_retry=$transport_retry" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "STAGING_SSH_CLASSIFICATION=$status rc=$ssh_rc fresh_runner=$RUNNER_ATTEMPT_NO/3" >&2

      - name: Gate SSH preflight result
        if: ${{ steps.prior_completion.outputs.complete != 'true' && steps.ssh_preflight.outputs.connected != 'true' }}
        shell: bash
        env:
          SSH_STATUS: ${{ steps.ssh_preflight.outputs.status }}
          TRANSPORT_RETRY: ${{ steps.ssh_preflight.outputs.transport_retry }}
        run: |
          set -euo pipefail
          case "$SSH_STATUS" in
            transport)
              [[ "$TRANSPORT_RETRY" == 'true' ]]
              echo "STAGING_SSH=RETRY_FRESH_RUNNER current=$RUNNER_ATTEMPT_NO/3 no_snapshot=1 no_mutation=1"
              exit 0
              ;;
            auth)
              echo 'STAGING_SSH=FAIL_AUTH; fresh-runner retry forbidden.' >&2
              exit 1
              ;;
            hostkey)
              echo 'STAGING_SSH=FAIL_HOSTKEY; fresh-runner retry forbidden.' >&2
              exit 1
              ;;
            remote_env)
              echo 'STAGING_SSH=FAIL_REMOTE_ENV; transport succeeded but remote prerequisites failed.' >&2
              exit 1
              ;;
            *)
              echo "STAGING_SSH=FAIL_OTHER status=${SSH_STATUS:-missing}; unclassified SSH failure is not retryable." >&2
              exit 1
              ;;
          esac

      - name: Create full rollback snapshot before any runtime mutation
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$STAGING_PARENT/.nvx-rollback/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CANDIDATE_SHA}-runner-${RUNNER_ATTEMPT_NO}"
          [[ "$ROLLBACK_DIR" == "$STAGING_PARENT/.nvx-rollback/"* ]]
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          cd "$STAGING_ROOT"
          umask 077
          mkdir -p "$ROLLBACK_DIR"
          test -s "$STAGING_ROOT/wp-config.php"
          cp -p "$STAGING_ROOT/wp-config.php" "$ROLLBACK_DIR/wp-config.php"
          tar -czf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT" wp-content/themes/nuvanx-medical
          if [[ -d "$STAGING_ROOT/wp-content/mu-plugins" ]]; then tar -czf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT" wp-content/mu-plugins; fi
          wp db export "$ROLLBACK_DIR/staging-db.sql" --quiet
          test -s "$ROLLBACK_DIR/wp-config.php"; test -s "$ROLLBACK_DIR/theme.tgz"; test -s "$ROLLBACK_DIR/staging-db.sql"
          if [[ -f wp-content/themes/nuvanx-medical/.nvx-deploy-sha ]]; then tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha > "$ROLLBACK_DIR/previous-sha.txt"; else : > "$ROLLBACK_DIR/previous-sha.txt"; fi
          echo "ROLLBACK_SNAPSHOT=PASS path=$ROLLBACK_DIR"
          REMOTE
          echo 'STAGING_SNAPSHOT_READY=1' >> "$GITHUB_ENV"

      - name: Verify environment isolation and normalize runtime
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'STAGING_MUTATION_ARMED=1' >> "$GITHUB_ENV"
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          if ! wp eval 'exit((defined("WP_DEBUG_DISPLAY") && WP_DEBUG_DISPLAY === false) ? 0 : 1);'; then
            wp config set WP_DEBUG_DISPLAY false --raw
            php -l wp-config.php >/dev/null
          fi
          wp eval 'exit((defined("WP_DEBUG_DISPLAY") && WP_DEBUG_DISPLAY === false) ? 0 : 1);'
          wp plugin is-installed sg-cachepress
          if wp plugin is-active sg-cachepress; then wp plugin deactivate sg-cachepress --quiet; fi
          ! wp plugin is-active sg-cachepress
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          echo 'ENVIRONMENT_ISOLATION=PASS'
          REMOTE

      - name: Upload immutable payload
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$STAGING_ROOT/wp-content/.nuvanx-deployments/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runner-${RUNNER_ATTEMPT_NO}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-staging2 "mkdir -p '$REMOTE_RELEASE/theme' '$REMOTE_RELEASE/tools/migrations' '$REMOTE_RELEASE/lib'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' wp-content/themes/nuvanx-medical/ "nvx-staging2:$REMOTE_RELEASE/theme/"
          rsync -az tools/deploy/deploy-to-staging2.sh "nvx-staging2:$REMOTE_RELEASE/deploy-to-staging2.sh"
          rsync -az lib/ "nvx-staging2:$REMOTE_RELEASE/lib/"
          rsync -az tools/migrations/ "nvx-staging2:$REMOTE_RELEASE/tools/migrations/"

      - name: Deploy theme and content hygiene
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$STAGING_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$CANDIDATE_SHA' --confirm"

          ssh nvx-staging2 \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/content-hygiene-shared.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-shared-${{ github.sha }}.log'"
          ssh nvx-staging2 \
            "grep -q 'Status: MIGRATION_OK' '$REMOTE_RELEASE/migration-shared-${{ github.sha }}.log'" || exit 1

          ssh nvx-staging2 \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/content-hygiene-staging-only.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-staging-only-${{ github.sha }}.log'"
          ssh nvx-staging2 \
            "grep -q 'Status: MIGRATION_OK' '$REMOTE_RELEASE/migration-staging-only-${{ github.sha }}.log'" || exit 1

          ssh nvx-staging2 \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/reconcile-publication-robots.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-robots-${{ github.sha }}.log'"
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' REMOTE_RELEASE='$REMOTE_RELEASE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          original_env="$(wp config get WP_ENVIRONMENT_TYPE)"
          [[ "$original_env" == 'staging' ]]
          restore_environment() {
            wp config set WP_ENVIRONMENT_TYPE "$original_env"
            php -l wp-config.php >/dev/null
          }
          trap restore_environment EXIT
          grep -q 'PUBLICATION_ROBOTS_RECONCILIATION=PASS' "$REMOTE_RELEASE/migration-robots-${{ github.sha }}.log"
          wp eval-file "$REMOTE_RELEASE/tools/migrations/audit-publication-indexables-runtime.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/audit-indexables-runtime-${{ github.sha }}.log"
          grep -q 'PUBLICATION_INDEXABLE_RUNTIME_AUDIT=PASS' "$REMOTE_RELEASE/audit-indexables-runtime-${{ github.sha }}.log"
          wp config set WP_ENVIRONMENT_TYPE production
          php -l wp-config.php >/dev/null
          NVX_ALLOW_STAGING_YOAST_INDEXABLE_REBUILD=1 wp eval-file "$REMOTE_RELEASE/tools/migrations/run-yoast-indexable-rebuild.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/yoast-index-${{ github.sha }}.log"
          grep -q 'YOAST_INDEXABLE_REBUILD=PASS' "$REMOTE_RELEASE/yoast-index-${{ github.sha }}.log"
          NVX_ALLOW_STAGING_YOAST_INDEXABLE_REBUILD=1 wp eval-file "$REMOTE_RELEASE/tools/migrations/reconcile-publication-indexables.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/migration-indexables-${{ github.sha }}.log"
          grep -q 'PUBLICATION_INDEXABLE_RECONCILIATION=PASS' "$REMOTE_RELEASE/migration-indexables-${{ github.sha }}.log"
          wp eval-file "$REMOTE_RELEASE/tools/migrations/invalidate-publication-sitemap-cache.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/migration-sitemap-cache-${{ github.sha }}.log"
          grep -q 'PUBLICATION_SITEMAP_CACHE_INVALIDATION=PASS' "$REMOTE_RELEASE/migration-sitemap-cache-${{ github.sha }}.log"
          wp eval-file "$REMOTE_RELEASE/tools/migrations/audit-publication-sitemap-selection.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/audit-sitemap-selection-${{ github.sha }}.log"
          grep -q 'PUBLICATION_SITEMAP_SELECTION=PASS' "$REMOTE_RELEASE/audit-sitemap-selection-${{ github.sha }}.log"
          REMOTE

          ssh nvx-staging2 \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/audit-content-divergence.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-audit-${{ github.sha }}.log'"
          ssh nvx-staging2 \
            "grep -q 'Status: AUDIT_CLEAN' '$REMOTE_RELEASE/migration-audit-${{ github.sha }}.log'" || exit 1
          echo 'STAGING_CONTENT_MIGRATION=PASS audit=clean'

      - name: Purge caches and verify exact Staging2 identity
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' CANDIDATE_SHA='$CANDIDATE_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          wp cache flush
          plugin_slug='sg-cachepress'
          if ! wp plugin is-active "$plugin_slug"; then wp plugin activate "$plugin_slug" --quiet; fi
          wp sg purge
          # Keep Optimizer active: the theme's versioned sitemap exclusions rely
          # on its response-header integration to prevent stale XML delivery.
          wp plugin is-active "$plugin_slug"
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-* wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }'
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$CANDIDATE_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo "STAGING_DEPLOYED_SHA=$CANDIDATE_SHA"
          REMOTE

      - name: Verify publication sitemap coverage
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Reads the sitemap XML from inside the server via SSH to bypass
          # SiteGround Antibot, which blocks external HTTP from CI runners.
          # All curl calls use http://localhost with a Host header so they
          # hit the WordPress vhost directly without TLS or external routing.
          pass=0
          for attempt in {1..12}; do
            sitemap_index=$(ssh nvx-staging2 \
              "curl -4 -fsSL --connect-timeout 10 --max-time 30 \
               -H 'Accept: application/xml,text/xml,*/*' \
               -H 'Cache-Control: no-cache' \
               -H 'Host: staging2.nuvanx.com' \
               -A 'NUVANX-Staging-Sitemap-Contract/1.0' \
               http://localhost/sitemap_index.xml" 2>/dev/null || true)
            if echo "$sitemap_index" | grep -qE '<sitemapindex|<urlset'; then
              combined_xml="$sitemap_index"
              child_paths=$(echo "$sitemap_index" \
                | grep -oE 'https://staging2\.nuvanx\.com/[^<]+\.xml' \
                | sed 's|https://staging2\.nuvanx\.com||' || true)
              for child_path in $child_paths; do
                child_xml=$(ssh nvx-staging2 \
                  "curl -4 -fsSL --connect-timeout 10 --max-time 30 \
                   -H 'Accept: application/xml,text/xml,*/*' \
                   -H 'Cache-Control: no-cache' \
                   -H 'Host: staging2.nuvanx.com' \
                   -A 'NUVANX-Staging-Sitemap-Contract/1.0' \
                   http://localhost${child_path}" 2>/dev/null || true)
                combined_xml="${combined_xml}${child_xml}"
              done
              url_count=$(echo "$combined_xml" | grep -oE '<loc>[^<]+' | grep -vc '\.xml$' || true)
              echo "SITEMAP_URLS_FROM_SERVER=$url_count"
              if SITEMAP_XML_CONTENT="$combined_xml" \
                 EXPECTED_HOST=staging2.nuvanx.com \
                 node scripts/staging2/verify-publication-sitemap-from-xml.mjs; then
                pass=1
                break
              fi
            fi
            echo "Sitemap not ready on attempt $attempt/12, retrying in 15s…"
            sleep 15
          done
          test "$pass" = 1
          echo 'STAGING_SITEMAP_MANIFEST_COVERAGE=PASS'

      - name: Verify public Staging2 boundary
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        env:
          BASE_URL: https://staging2.nuvanx.com
          EXPECTED_HOST: staging2.nuvanx.com
          ORIGIN_SSH_ALIAS: nvx-staging2
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..12}; do
            if node scripts/staging2/verify-staging-boundary.mjs; then pass=1; break; fi
            sleep 10
          done
          test "$pass" = 1

      - name: Verify Goya alias query preservation contract
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          STAGING_URL="$STAGING_URL" \
          node scripts/staging2/test-goya-alias-query.mjs
          result=$?
          set -e
          if [[ "$result" -eq 75 ]]; then
            origin_headers="$RUNNER_TEMP/goya-alias-origin-headers.txt"
            ssh nvx-staging2 \
              "curl -kS -D - -o /dev/null --max-redirs 0 --max-time 30 --resolve staging2.nuvanx.com:443:127.0.0.1 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -b 'wpSGCacheBypass=1' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36 NUVANX-Staging-QA' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8' 'https://staging2.nuvanx.com/medicina-estetica-goya/?gclid=QA_REDIRECT_CI_GCLID_001&utm_source=google&utm_medium=cpc&utm_campaign=qa_redirect_contract'" \
              > "$origin_headers"
            origin_result=$?
            if [[ "$origin_result" -eq 75 ]] || [[ "$origin_result" -eq 28 ]]; then
              echo "STAGING_ACCEPTANCE_TRANSIENT=1" >> "$GITHUB_ENV"
              echo "GOYA_ALIAS_ORIGIN=TRANSIENT status=$origin_result" >&2
              exit 75
            fi
            STAGING_URL="$STAGING_URL" \
            GOYA_ALIAS_RESPONSE_FILE="$origin_headers" \
            node scripts/staging2/test-goya-alias-query.mjs
          else
            test "$result" -eq 0
          fi

      - name: Validate WordPress page templates from origin
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          PAGES_FILE="$RUNNER_TEMP/staging2-published-pages.json"
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' bash -se" <<'REMOTE' > "$PAGES_FILE"
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          wp eval '$pages=get_posts(array("post_type"=>array("page","post"),"post_status"=>"publish","posts_per_page"=>-1,"orderby"=>"ID","order"=>"ASC")); $payload=array_map(static function($p){return array("id"=>(int)$p->ID,"slug"=>(string)$p->post_name,"link"=>(string)get_permalink($p->ID),"title"=>(string)get_the_title($p->ID),"post_type"=>(string)$p->post_type,"template"=>"page" === $p->post_type ? (string)get_page_template_slug($p->ID) : "");},$pages); echo wp_json_encode($payload);'
          REMOTE
          [[ -s "$PAGES_FILE" ]] || { echo "WP-CLI published-content snapshot is empty" >&2; exit 1; }
          echo "WORDPRESS_PAGES_FILE=$PAGES_FILE" >> "$GITHUB_ENV"
          set +e
          WORDPRESS_PAGES_FILE="$PAGES_FILE" node scripts/validate-page-templates.mjs
          val_rc=$?
          set -e
          if [[ "$val_rc" -eq 75 ]]; then
            echo 'STAGING_ACCEPTANCE_TRANSIENT=1' >> "$GITHUB_ENV"
            echo 'STAGING_ACCEPTANCE=RETRY_FRESH_RUNNER component=validate-page-templates exit=75'
            exit 0
          fi
          [[ "$val_rc" -eq 0 ]] || exit "$val_rc"
          echo 'STAGING_TEMPLATE_INTEGRITY=PASS'

      - name: Install browser acceptance dependencies
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' && env.RUN_ACCEPTANCE == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/staging2

          set +e
          timeout --signal=TERM --kill-after=15s 300s npm ci --ignore-scripts
          npm_rc=$?
          set -e
          if [[ "$npm_rc" -eq 124 || "$npm_rc" -eq 137 ]]; then
            echo 'STAGING_ACCEPTANCE_TRANSIENT=1' >> "$GITHUB_ENV"
            echo "STAGING_ACCEPTANCE=RETRY_FRESH_RUNNER component=npm-ci exit=$npm_rc"
            exit 0
          fi
          [[ "$npm_rc" -eq 0 ]] || exit "$npm_rc"

          set +e
          timeout --signal=TERM --kill-after=15s 300s ./node_modules/.bin/playwright install --with-deps chromium
          playwright_rc=$?
          set -e
          if [[ "$playwright_rc" -eq 124 || "$playwright_rc" -eq 137 ]]; then
            echo 'STAGING_ACCEPTANCE_TRANSIENT=1' >> "$GITHUB_ENV"
            echo "STAGING_ACCEPTANCE=RETRY_FRESH_RUNNER component=playwright-install exit=$playwright_rc"
            exit 0
          fi
          [[ "$playwright_rc" -eq 0 ]] || exit "$playwright_rc"

      - name: Run canonical Block C and valoración placement
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' && env.RUN_ACCEPTANCE == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        shell: bash
        env:
          BASE_URL: https://staging2.nuvanx.com
          EXPECTED_HOST: staging2.nuvanx.com
        run: |
          set -Eeuo pipefail
          mkdir -p scripts/staging2/block-c-artifacts scripts/staging2/valoracion-artifacts

          set +e
          node scripts/staging2/block-c-entrypoint.mjs
          block_rc=$?
          set -e
          if [[ "$block_rc" -eq 75 ]]; then
            echo 'STAGING_ACCEPTANCE_TRANSIENT=1' >> "$GITHUB_ENV"
            echo 'STAGING_ACCEPTANCE=RETRY_FRESH_RUNNER component=block-c exit=75'
            exit 0
          fi
          [[ "$block_rc" -eq 0 ]] || exit "$block_rc"

          set +e
          node scripts/staging2/valoracion-placement.mjs
          valoracion_rc=$?
          set -e
          if [[ "$valoracion_rc" -eq 75 ]]; then
            echo 'STAGING_ACCEPTANCE_TRANSIENT=1' >> "$GITHUB_ENV"
            echo 'STAGING_ACCEPTANCE=RETRY_FRESH_RUNNER component=valoracion-or-a11y exit=75'
            exit 0
          fi
          [[ "$valoracion_rc" -eq 0 ]] || exit "$valoracion_rc"
          echo 'STAGING_BLOCK_C=PASS'

      - name: Verify production unchanged read-only
        if: ${{ steps.ssh_preflight.outputs.connected == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "PROD_ROOT='$PROD_ROOT' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(wp config get DB_NAME)" = 'db0ecrycwv2tgb'
          test "$(wp option get home)" = 'https://nuvanx.com'
          test "$(wp option get siteurl)" = 'https://nuvanx.com'
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo 'PRODUCTION_UNCHANGED=PASS'
          REMOTE

      - name: Write immutable Staging acceptance manifest
        if: ${{ success() && steps.ssh_preflight.outputs.connected == 'true' && env.RUN_ACCEPTANCE == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/staging2/artifacts
          jq -n \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg workflow_path '.github/workflows/staging.yml' \
            '{schema:1,candidate_sha:$candidate_sha,run_id:$run_id,run_attempt:$run_attempt,event:$event,head_sha:$head_sha,head_branch:$head_branch,workflow_path:$workflow_path}' \
            > scripts/staging2/artifacts/acceptance-manifest.json
          jq -e --arg sha "$CANDIDATE_SHA" --arg run "$GITHUB_RUN_ID" '.schema == 1 and .candidate_sha == $sha and .run_id == $run' scripts/staging2/artifacts/acceptance-manifest.json >/dev/null
          echo "STAGING_ACCEPTANCE_MANIFEST=PASS sha=$CANDIDATE_SHA run_id=$GITHUB_RUN_ID"

      - name: Upload production-eligible acceptance evidence
        if: ${{ success() && steps.ssh_preflight.outputs.connected == 'true' && env.RUN_ACCEPTANCE == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging2-block-c-${{ env.CANDIDATE_SHA }}
          path: |
            scripts/staging2/artifacts/
            scripts/staging2/block-c-artifacts/
            scripts/staging2/valoracion-artifacts/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6

      - name: Write fresh-runner completion marker
        if: ${{ success() && steps.ssh_preflight.outputs.connected == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/staging-deploy-complete.json"
          jq -n \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg runner_attempt "$RUNNER_ATTEMPT_NO" \
            --arg run_acceptance "$RUN_ACCEPTANCE" \
            '{schema:1,candidate_sha:$candidate_sha,run_id:$run_id,run_attempt:$run_attempt,runner_attempt:$runner_attempt,run_acceptance:$run_acceptance}' \
            > "$marker"
          jq -e --arg sha "$CANDIDATE_SHA" '.schema == 1 and .candidate_sha == $sha' "$marker" >/dev/null
          echo "STAGING_COMPLETION_MARKER=$marker" >> "$GITHUB_ENV"

      - name: Upload fresh-runner completion marker
        if: ${{ success() && steps.ssh_preflight.outputs.connected == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging2-deploy-complete-${{ env.CANDIDATE_SHA }}
          path: ${{ env.STAGING_COMPLETION_MARKER }}
          retention-days: 2
          if-no-files-found: error
          compression-level: 0

      - name: Upload failed or transient Staging diagnostic evidence
        if: ${{ (failure() || env.STAGING_ACCEPTANCE_TRANSIENT == '1') && steps.ssh_preflight.outputs.connected == 'true' && env.RUN_ACCEPTANCE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging2-block-c-diagnostic-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}-runner-${{ matrix.runner_attempt }}
          path: |
            scripts/staging2/artifacts/
            scripts/staging2/block-c-artifacts/
            scripts/staging2/valoracion-artifacts/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: Roll back complete Staging2 state after failure
        if: ${{ failure() && env.STAGING_SNAPSHOT_READY == '1' && env.STAGING_MUTATION_ARMED == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2 "STAGING_ROOT='$STAGING_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$ROLLBACK_DIR" == '/home/customer/www/staging2.nuvanx.com/.nvx-rollback/'* ]]
          test -s "$ROLLBACK_DIR/wp-config.php"; test -s "$ROLLBACK_DIR/theme.tgz"; test -s "$ROLLBACK_DIR/staging-db.sql"
          cp -p "$ROLLBACK_DIR/wp-config.php" "$STAGING_ROOT/wp-config.php"
          php -l "$STAGING_ROOT/wp-config.php" >/dev/null
          rm -rf "$STAGING_ROOT/wp-content/themes/nuvanx-medical"
          tar -xzf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT"
          if [[ -f "$ROLLBACK_DIR/mu-plugins.tgz" ]]; then rm -rf "$STAGING_ROOT/wp-content/mu-plugins"; tar -xzf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT"; fi
          cd "$STAGING_ROOT"
          wp db import "$ROLLBACK_DIR/staging-db.sql"
          wp cache flush
          plugin_slug='sg-cachepress'
          if wp plugin is-installed "$plugin_slug"; then
            if ! wp plugin is-active "$plugin_slug"; then wp plugin activate "$plugin_slug" --quiet || true; fi
            wp sg purge || true
            wp plugin deactivate "$plugin_slug" --quiet || true
          fi
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-* wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }' || true
          previous="$(cat "$ROLLBACK_DIR/previous-sha.txt" 2>/dev/null || true)"
          if [[ -n "$previous" ]]; then test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$previous"; fi
          echo 'ROLLBACK_STAGING=PASS'
          REMOTE

      - name: Clean remote payload, snapshot and SSH identity
        if: always()
        shell: bash
        run: |
          set +e
          if [[ "${{ steps.ssh_preflight.outputs.connected }}" == 'true' && -f "$HOME/.ssh/config" ]]; then
            [[ -z "${REMOTE_RELEASE:-}" ]] || ssh nvx-staging2 "rm -rf '$REMOTE_RELEASE'" || true
            if [[ "${{ job.status }}" == 'success' && "${{ env.STAGING_ACCEPTANCE_TRANSIENT }}" != '1' && -n "${ROLLBACK_DIR:-}" ]]; then ssh nvx-staging2 "case '$ROLLBACK_DIR' in '$STAGING_PARENT/.nvx-rollback/'*) rm -rf '$ROLLBACK_DIR' ;; *) exit 1 ;; esac" || true; fi
          fi
          rm -f "$HOME/.ssh/staging_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"

      - name: Write staging success summary
        if: ${{ success() && steps.ssh_preflight.outputs.connected == 'true' && env.STAGING_ACCEPTANCE_TRANSIENT != '1' }}
        shell: bash
        run: |
          {
            echo '## Staging runner PASS'
            echo
            echo "- Exact SHA: \`$CANDIDATE_SHA\`"
            echo "- Fresh runner: \`$RUNNER_ATTEMPT_NO/3\`"
            echo '- Single workflow owns static gates, deployment, rollback and acceptance.'
            echo '- Cross-environment mutation order is protected by the repository FIFO lease.'
            echo "- Block C production eligibility: \`$RUN_ACCEPTANCE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write transient retry summary
        if: ${{ success() && env.STAGING_ACCEPTANCE_TRANSIENT == '1' }}
        shell: bash
        run: |
          {
            echo '## Staging acceptance transient'
            echo
            echo "- Exact SHA remains deployed: \`$CANDIDATE_SHA\`"
            echo "- Fresh runner \`$RUNNER_ATTEMPT_NO/3\` could not complete third-party/edge acceptance."
            echo '- No production-eligible manifest or completion marker was created.'
            echo '- The next fresh runner will retry the same immutable SHA.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write transport retry summary
        if: ${{ success() && steps.ssh_preflight.outputs.transport_retry == 'true' }}
        shell: bash
        run: |
          {
            echo '## Staging SSH transport retry'
            echo
            echo "- Fresh runner \`$RUNNER_ATTEMPT_NO/3\` could not establish TCP/SSH transport."
            echo '- No rollback snapshot or runtime mutation was started.'
            echo '- The next matrix entry receives a new GitHub-hosted runner.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_staging:
    name: Deploy exact master SHA and run acceptance
    needs: [quality, deploy_staging_runners]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha || github.sha }}
      RUNNER_MATRIX_RESULT: ${{ needs.deploy_staging_runners.result }}
      SSH_TRANSPORT_EXIT_CODE: 255
    steps:
      - name: Require a completed fresh-runner deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_MATRIX_RESULT" == 'success' ]] || { echo "STAGING_RUNNER_MATRIX=FAIL result=$RUNNER_MATRIX_RESULT" >&2; exit 1; }
          candidate="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo 'Candidate must be a full lowercase 40-character SHA.' >&2; exit 1; }
          artifact_name="staging2-deploy-complete-${candidate}"
          response="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${artifact_name}&per_page=100")"
          count="$(printf '%s' "$response" | jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
          if (( count < 1 )); then
            diagnostic_prefix="staging2-block-c-diagnostic-${candidate}-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-runner-"
            all_artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
            transient_count="$(printf '%s' "$all_artifacts" | jq -r --arg prefix "$diagnostic_prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | length')"
            if (( transient_count > 0 )); then
              echo "STAGING_ACCEPTANCE=FAIL_TRANSIENT_EXHAUSTED sha=$candidate diagnostic_artifacts=$transient_count" >&2
              exit 75
            fi
            echo "STAGING_SSH=FAIL_TRANSPORT all 3 fresh runners exhausted without a completed deployment for $candidate" >&2
            exit "$SSH_TRANSPORT_EXIT_CODE"
          fi
          echo "STAGING_FRESH_RUNNER_GATE=PASS artifact=$artifact_name count=$count sha=$candidate"

  pr_preview:
    name: Labeled same-repo PR preview on Staging2
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'deploy-staging2' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted master tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted PR boundary and candidate syntax
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin master
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/nvx-pr-preview"
          test "$(git rev-parse refs/remotes/origin/nvx-pr-preview)" = "$PR_SHA"
          mapfile -t changed < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | sort -u)
          (( ${#changed[@]} > 0 ))
          for file in "${changed[@]}"; do case "$file" in wp-content/themes/nuvanx-medical/*) ;; *) echo "PR preview refuses non-theme change: $file" >&2; exit 1 ;; esac; done
          CANDIDATE_ROOT="$RUNNER_TEMP/nvx-pr-${PR_NUMBER}-${PR_SHA}"
          git worktree add --detach "$CANDIDATE_ROOT" origin/master
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          set +e
          git -C "$CANDIDATE_ROOT" -c user.name='NUVANX CI' -c user.email='ci@nuvanx.invalid' merge --no-commit --no-ff "$PR_SHA"
          merge_rc=$?
          set -e
          if (( merge_rc != 0 )); then
            git -C "$CANDIDATE_ROOT" merge --abort || true
            echo 'PR preview merge conflict against current master; resolve or rebase the PR.' >&2
            exit 1
          fi
          if git -C "$CANDIDATE_ROOT" rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git -C "$CANDIDATE_ROOT" -c user.name='NUVANX CI' -c user.email='ci@nuvanx.invalid' commit --no-gpg-sign -m "ci: preview merge PR #${PR_NUMBER} into master"
          fi
          PR_PREVIEW_SHA="$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)"
          [[ "$PR_PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C "$CANDIDATE_ROOT" diff --check origin/master "$PR_PREVIEW_SHA"
          ! git -C "$CANDIDATE_ROOT" ls-tree -r "$PR_PREVIEW_SHA" wp-content/themes/nuvanx-medical/ | awk '$1 == "120000" { found=1 } END { exit(found ? 0 : 1) }'
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "PR_PREVIEW_SHA=$PR_PREVIEW_SHA" >> "$GITHUB_ENV"
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo "PR_BOUNDARY=PASS pr_sha=$PR_SHA preview_sha=$PR_PREVIEW_SHA"

      - name: Wait for FIFO environment mutation turn
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_ROLE: pr-preview
          MUTATION_WAIT_MAX_SECONDS: 5400
        run: bash scripts/ci/wait-for-environment-mutation-turn.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Configure strict Staging2 SSH
        shell: bash
        env:
          HOST: ${{ secrets.STAGING2_SSH_HOST }}
          PORT: ${{ secrets.STAGING2_SSH_PORT }}
          USER: ${{ secrets.STAGING2_SSH_USER }}
          KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          KH: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${HOST:?}"; : "${USER:?}"; : "${KEY:?}"; : "${KH:?}"
          SSH_PORT="${PORT:-18765}"; [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/staging_pr_key"; chmod 600 "$HOME/.ssh/staging_pr_key"
          printf '%s\n' "$KH" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts" || { echo 'STAGING_PR_KNOWN_HOSTS=EMPTY' >&2; exit 1; }
          cat > "$HOME/.ssh/config" <<EOF
          Host nvx-staging2-pr
            HostName $HOST
            User $USER
            Port $SSH_PORT
            IdentityFile $HOME/.ssh/staging_pr_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            ConnectTimeout 15
            ConnectionAttempts 1
            ServerAliveInterval 15
            ServerAliveCountMax 2
          EOF
          chmod 600 "$HOME/.ssh/config"
          pr_connected=0
          retry_delay="$SSH_RETRY_BASE_DELAY_SECONDS"
          for attempt in $(seq 1 "$SSH_RETRY_ATTEMPTS"); do
            if ssh -n nvx-staging2-pr "test -d '$STAGING_ROOT' && test -d '$PROD_ROOT' && command -v wp >/dev/null && command -v rsync >/dev/null"; then
              pr_connected=1; break
            fi
            if [[ "$attempt" -ne "$SSH_RETRY_ATTEMPTS" ]]; then
              echo "Staging PR SSH attempt $attempt/$SSH_RETRY_ATTEMPTS failed; retrying in ${retry_delay}s..."
              sleep "$retry_delay"
              retry_delay=$((retry_delay + SSH_RETRY_BASE_DELAY_SECONDS))
            fi
          done
          [[ "$pr_connected" = 1 ]] || { echo "STAGING_PR_SSH=FAIL_TRANSPORT: could not reach SiteGround after $SSH_RETRY_ATTEMPTS attempts." >&2; exit "$SSH_TRANSPORT_EXIT_CODE"; }

      - name: Snapshot and deploy PR candidate with trusted tooling
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_DIR="$STAGING_PARENT/.nvx-rollback/pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PR_PREVIEW_SHA}"
          REMOTE_RELEASE="$STAGING_ROOT/wp-content/.nuvanx-deployments/pr-${PR_NUMBER}-${PR_PREVIEW_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ROLLBACK_DIR=$ROLLBACK_DIR" >> "$GITHUB_ENV"; echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' PROD_ROOT='$PROD_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          test "$STAGING_ROOT" != "$PROD_ROOT"
          cd "$STAGING_ROOT"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'; test "$(wp option get home)" = 'https://staging2.nuvanx.com'; test "$(wp option get blog_public)" = '0'
          if wp plugin is-active sg-cachepress; then wp plugin deactivate sg-cachepress --quiet; fi
          umask 077; mkdir -p "$ROLLBACK_DIR"
          tar -czf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT" wp-content/themes/nuvanx-medical
          if [[ -d wp-content/mu-plugins ]]; then tar -czf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT" wp-content/mu-plugins; fi
          wp db export "$ROLLBACK_DIR/staging-db.sql" --quiet
          if [[ -f wp-content/themes/nuvanx-medical/.nvx-deploy-sha ]]; then tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha > "$ROLLBACK_DIR/previous-sha.txt"; else : > "$ROLLBACK_DIR/previous-sha.txt"; fi
          REMOTE
          echo 'STAGING_SNAPSHOT_READY=1' >> "$GITHUB_ENV"
          ssh nvx-staging2-pr "mkdir -p '$REMOTE_RELEASE/theme' '$REMOTE_RELEASE/tools/migrations' '$REMOTE_RELEASE/lib'"
          rsync -az --delete --exclude='.git' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical/" "nvx-staging2-pr:$REMOTE_RELEASE/theme/"
          rsync -az lib/ "nvx-staging2-pr:$REMOTE_RELEASE/lib/"
          rsync -az tools/migrations/ "nvx-staging2-pr:$REMOTE_RELEASE/tools/migrations/"
          rsync -az tools/deploy/deploy-to-staging2.sh "nvx-staging2-pr:$REMOTE_RELEASE/"
          echo 'STAGING_MUTATION_ARMED=1' >> "$GITHUB_ENV"
          ssh nvx-staging2-pr "NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-staging2.sh' --wp-root '$STAGING_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$PR_PREVIEW_SHA' --confirm"

          ssh nvx-staging2-pr \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/content-hygiene-shared.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-shared-${{ github.sha }}.log'"
          ssh nvx-staging2-pr \
            "grep -q 'Status: MIGRATION_OK' '$REMOTE_RELEASE/migration-shared-${{ github.sha }}.log'" || exit 1

          ssh nvx-staging2-pr \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/content-hygiene-staging-only.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-staging-only-${{ github.sha }}.log'"
          ssh nvx-staging2-pr \
            "grep -q 'Status: MIGRATION_OK' '$REMOTE_RELEASE/migration-staging-only-${{ github.sha }}.log'" || exit 1

          ssh nvx-staging2-pr \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/reconcile-publication-robots.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-robots-${{ github.sha }}.log'"
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' REMOTE_RELEASE='$REMOTE_RELEASE' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          original_env="$(wp config get WP_ENVIRONMENT_TYPE)"
          [[ "$original_env" == 'staging' ]]
          restore_environment() {
            wp config set WP_ENVIRONMENT_TYPE "$original_env"
            php -l wp-config.php >/dev/null
          }
          trap restore_environment EXIT
          grep -q 'PUBLICATION_ROBOTS_RECONCILIATION=PASS' "$REMOTE_RELEASE/migration-robots-${{ github.sha }}.log"
          wp eval-file "$REMOTE_RELEASE/tools/migrations/audit-publication-indexables-runtime.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/audit-indexables-runtime-${{ github.sha }}.log"
          grep -q 'PUBLICATION_INDEXABLE_RUNTIME_AUDIT=PASS' "$REMOTE_RELEASE/audit-indexables-runtime-${{ github.sha }}.log"
          wp config set WP_ENVIRONMENT_TYPE production
          php -l wp-config.php >/dev/null
          NVX_ALLOW_STAGING_YOAST_INDEXABLE_REBUILD=1 wp eval-file "$REMOTE_RELEASE/tools/migrations/run-yoast-indexable-rebuild.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/yoast-index-${{ github.sha }}.log"
          grep -q 'YOAST_INDEXABLE_REBUILD=PASS' "$REMOTE_RELEASE/yoast-index-${{ github.sha }}.log"
          NVX_ALLOW_STAGING_YOAST_INDEXABLE_REBUILD=1 wp eval-file "$REMOTE_RELEASE/tools/migrations/reconcile-publication-indexables.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/migration-indexables-${{ github.sha }}.log"
          grep -q 'PUBLICATION_INDEXABLE_RECONCILIATION=PASS' "$REMOTE_RELEASE/migration-indexables-${{ github.sha }}.log"
          wp eval-file "$REMOTE_RELEASE/tools/migrations/invalidate-publication-sitemap-cache.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/migration-sitemap-cache-${{ github.sha }}.log"
          grep -q 'PUBLICATION_SITEMAP_CACHE_INVALIDATION=PASS' "$REMOTE_RELEASE/migration-sitemap-cache-${{ github.sha }}.log"
          wp eval-file "$REMOTE_RELEASE/tools/migrations/audit-publication-sitemap-selection.php" --allow-root 2>&1 | tee "$REMOTE_RELEASE/audit-sitemap-selection-${{ github.sha }}.log"
          grep -q 'PUBLICATION_SITEMAP_SELECTION=PASS' "$REMOTE_RELEASE/audit-sitemap-selection-${{ github.sha }}.log"
          REMOTE

          ssh nvx-staging2-pr \
            "cd '$STAGING_ROOT' && \
             wp eval-file '$REMOTE_RELEASE/tools/migrations/audit-content-divergence.php' \
             --allow-root 2>&1 | tee '$REMOTE_RELEASE/migration-audit-${{ github.sha }}.log'"
          ssh nvx-staging2-pr \
            "grep -q 'Status: AUDIT_CLEAN' '$REMOTE_RELEASE/migration-audit-${{ github.sha }}.log'" || exit 1
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' PR_SHA='$PR_SHA' PR_PREVIEW_SHA='$PR_PREVIEW_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGING_ROOT"
          wp cache flush
          plugin_slug='sg-cachepress'
          if ! wp plugin is-active "$plugin_slug"; then wp plugin activate "$plugin_slug" --quiet; fi
          wp sg purge
          # Keep Optimizer active: the theme's versioned sitemap exclusions rely
          # on its response-header integration to prevent stale XML delivery.
          wp plugin is-active "$plugin_slug"
          rm -rf wp-content/uploads/siteground-optimizer-assets/siteground-optimizer-combined-* wp-content/cache/sgo-cache/* wp-content/cache/*
          wp eval 'if (function_exists("opcache_reset")) { opcache_reset(); }'
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$PR_PREVIEW_SHA"
          test "$(wp config get DB_NAME)" = 'dbshcocboodiwr'
          test "$(wp option get home)" = 'https://staging2.nuvanx.com'
          test "$(wp option get siteurl)" = 'https://staging2.nuvanx.com'
          test "$(wp option get blog_public)" = '0'
          test "$(wp config get NVX_ENV)" = 'staging'
          test "$(wp config get WP_ENVIRONMENT_TYPE)" = 'staging'
          echo "PR_STAGING_IDENTITY=PASS pr_sha=$PR_SHA preview_sha=$PR_PREVIEW_SHA"
          REMOTE

      - name: Verify PR preview boundary and browser acceptance
        shell: bash
        env:
          BASE_URL: https://staging2.nuvanx.com
          EXPECTED_HOST: staging2.nuvanx.com
          ORIGIN_SSH_ALIAS: nvx-staging2-pr
          BLOCK_C_MAX_ATTEMPTS: "3"
          VALORACION_PLACEMENT_CYCLES: "3"
          HUBSPOT_A11Y_CYCLES: "3"
        run: |
          set -euo pipefail
          export EXPECTED_SHA="$PR_PREVIEW_SHA"
          ssh nvx-staging2-pr "cd '$STAGING_ROOT' && test \"\$(tr -d '\\r\\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)\" = '$PR_PREVIEW_SHA'"
          pass=0; for attempt in {1..12}; do if node scripts/staging2/verify-staging-boundary.mjs; then pass=1; break; fi; sleep 10; done; test "$pass" = 1
          cd scripts/staging2
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
          cd ../..
          mkdir -p scripts/staging2/block-c-artifacts scripts/staging2/valoracion-artifacts
          node scripts/staging2/block-c-entrypoint.mjs
          node scripts/staging2/valoracion-placement.mjs
          echo 'PR_BLOCK_C=PASS'

      - name: Verify production unchanged
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr "cd '$PROD_ROOT' && test \"\$(wp config get DB_NAME)\" = 'db0ecrycwv2tgb' && test \"\$(wp option get home)\" = 'https://nuvanx.com' && test \"\$(wp option get blog_public)\" = '1'"

      - name: Upload PR-only evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging2-pr-preview-${{ env.PR_NUMBER }}-${{ env.PR_SHA }}
          path: |
            scripts/staging2/artifacts/
            scripts/staging2/block-c-artifacts/
            scripts/staging2/valoracion-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Roll back failed PR preview
        if: ${{ failure() && env.STAGING_SNAPSHOT_READY == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-staging2-pr "STAGING_ROOT='$STAGING_ROOT' ROLLBACK_DIR='$ROLLBACK_DIR' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$ROLLBACK_DIR" == '/home/customer/www/staging2.nuvanx.com/.nvx-rollback/'* ]]
          rm -rf "$STAGING_ROOT/wp-content/themes/nuvanx-medical"; tar -xzf "$ROLLBACK_DIR/theme.tgz" -C "$STAGING_ROOT"
          if [[ -f "$ROLLBACK_DIR/mu-plugins.tgz" ]]; then rm -rf "$STAGING_ROOT/wp-content/mu-plugins"; tar -xzf "$ROLLBACK_DIR/mu-plugins.tgz" -C "$STAGING_ROOT"; fi
          cd "$STAGING_ROOT"; wp db import "$ROLLBACK_DIR/staging-db.sql"; wp cache flush
          if wp plugin is-installed sg-cachepress; then wp plugin activate sg-cachepress --quiet || true; wp sg purge || true; wp plugin deactivate sg-cachepress --quiet || true; fi
          echo 'PR_ROLLBACK_STAGING=PASS'
          REMOTE

      - name: Cleanup PR preview
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" ]]; then
            [[ -z "${REMOTE_RELEASE:-}" ]] || ssh nvx-staging2-pr "rm -rf '$REMOTE_RELEASE'" || true
            if [[ "${{ job.status }}" == 'success' && -n "${ROLLBACK_DIR:-}" ]]; then ssh nvx-staging2-pr "rm -rf '$ROLLBACK_DIR'" || true; fi
          fi
          rm -f "$HOME/.ssh/staging_pr_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
          [[ -z "${CANDIDATE_ROOT:-}" ]] || git worktree remove --force "$CANDIDATE_ROOT" 2>/dev/null || true
