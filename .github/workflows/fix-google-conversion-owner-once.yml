name: Fix Google Conversion Owner Once

on:
  push:
    branches:
      - fix/google-conversion-owner-20260823
    paths:
      - .github/workflows/fix-google-conversion-owner-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-conversion-owner-20260823
          fetch-depth: 1

      - name: Remove theme-owned Google Ads conversion dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js')
          text = path.read_text(encoding='utf-8')

          owner_block = """\n\tvar adsClickSendTo = 'AW-18236597403/qut3CLWflOAcEJvJ8fdD';\n\n\tfunction pushAdsConversion(sendTo, extra) {\n\t\tvar payload = Object.assign({ send_to: sendTo }, extra || {});\n\t\tif (typeof window.gtag === 'function') {\n\t\t\twindow.gtag('event', 'conversion', payload);\n\t\t} else {\n\t\t\twindow.dataLayer = window.dataLayer || [];\n\t\t\twindow.dataLayer.push(Object.assign({ event: 'conversion' }, payload));\n\t\t}\n\t}\n\n\tfunction whenGtagReady(callback) {\n\t\tif (typeof window.gtag === 'function') {\n\t\t\tcallback();\n\t\t\treturn;\n\t\t}\n\t\tvar started = Date.now();\n\t\tvar timer = window.setInterval(function () {\n\t\t\tif (typeof window.gtag === 'function' || Date.now() - started > 2000) {\n\t\t\t\twindow.clearInterval(timer);\n\t\t\t\tcallback();\n\t\t\t}\n\t\t}, 50);\n\t}\n\n\tfunction reportPhoneWhatsAppConversion(url, options) {\n\t\tvar newTab = Boolean(options && options.newTab);\n\t\tvar navigatesAway = Boolean(url) && !newTab;\n\t\tvar finished = false;\n\t\tvar finish = function () {\n\t\t\tif (finished || !navigatesAway) return;\n\t\t\tfinished = true;\n\t\t\twindow.location = url; // NOSONAR - intentional post-conversion navigation; url is a validated WhatsApp/phone href from the DOM element\n\t\t};\n\n\t\twhenGtagReady(function () {\n\t\t\tpushAdsConversion(adsClickSendTo, navigatesAway ? { event_callback: finish } : {});\n\t\t});\n\n\t\tif (navigatesAway) {\n\t\t\twindow.setTimeout(finish, 1500);\n\t\t\treturn true;\n\t\t}\n\t\treturn false;\n\t}\n"""
          if text.count(owner_block) != 1:
              raise SystemExit(f'Expected one direct Google Ads owner block, found {text.count(owner_block)}')
          text = text.replace(owner_block, '\n', 1)

          whatsapp_old = """\t\tif (isWhatsApp) {\n\t\t\temit('whatsapp_click', Object.assign({ contact_method: 'whatsapp' }, common));\n\t\t\tif (reportPhoneWhatsAppConversion(href || undefined, {\n\t\t\t\tnewTab: target.getAttribute('target') === '_blank' || isJoinchatTarget(target) || !href,\n\t\t\t})) event.preventDefault();\n\t\t\treturn;\n\t\t}\n"""
          whatsapp_new = """\t\tif (isWhatsApp) {\n\t\t\temit('whatsapp_click', Object.assign({ contact_method: 'whatsapp' }, common));\n\t\t\treturn;\n\t\t}\n"""
          if text.count(whatsapp_old) != 1:
              raise SystemExit(f'Expected one WhatsApp direct conversion block, found {text.count(whatsapp_old)}')
          text = text.replace(whatsapp_old, whatsapp_new, 1)

          phone_old = """\t\tif (isPhone) {\n\t\t\temit('phone_click', {\n\t\t\t\tcontact_method: 'phone',\n\t\t\t\tcta_region: regionFor(target),\n\t\t\t\tcta_marker: dataEvent || 'tel_link',\n\t\t\t});\n\t\t\tif (reportPhoneWhatsAppConversion(href || undefined, { newTab: false })) {\n\t\t\t\tevent.preventDefault();\n\t\t\t}\n\t\t\treturn;\n\t\t}\n"""
          phone_new = """\t\tif (isPhone) {\n\t\t\temit('phone_click', {\n\t\t\t\tcontact_method: 'phone',\n\t\t\t\tcta_region: regionFor(target),\n\t\t\t\tcta_marker: dataEvent || 'tel_link',\n\t\t\t});\n\t\t\treturn;\n\t\t}\n"""
          if text.count(phone_old) != 1:
              raise SystemExit(f'Expected one phone direct conversion block, found {text.count(phone_old)}')
          text = text.replace(phone_old, phone_new, 1)

          forbidden = [
              'AW-18236597403/qut3CLWflOAcEJvJ8fdD',
              'pushAdsConversion',
              'reportPhoneWhatsAppConversion',
              "window.gtag('event', 'conversion'",
              "send_to: sendTo",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Forbidden direct Google Ads owner remains: {token}')

          required = [
              "emit('whatsapp_click'",
              "emit('phone_click'",
              "var signalName = 'nvx_conversion_signal'",
              'google-click-attribution',
              "gclid: ['nvx_google_click_id', 'hs_google_click_id']",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Required first-party attribution behavior missing: {token}')

          path.write_text(text, encoding='utf-8')
          PY

          node --check wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js
          git diff --check

      - name: Commit validated ownership fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-google-conversion-owner-once.yml
          git config user.name "Nuvanx Bot"
          git config user.email "bot@nuvanx.com"
          git add wp-content/themes/nuvanx-medical/assets/js/nvx-conversion-events.js .github/workflows/fix-google-conversion-owner-once.yml
          git diff --cached --check
          git commit -m "fix(analytics): make GTM sole Google Ads browser owner"
          git push origin HEAD:fix/google-conversion-owner-20260823
