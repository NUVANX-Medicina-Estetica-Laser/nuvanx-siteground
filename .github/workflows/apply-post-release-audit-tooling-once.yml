name: Apply Post-Release Audit Tooling Once

on:
  push:
    branches:
      - fix/post-release-audit-tooling-20260827
    paths:
      - .github/workflows/apply-post-release-audit-tooling-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/post-release-audit-tooling-20260827
          fetch-depth: 0
          persist-credentials: true
      - name: Restore and ratchet post-release audits
        shell: bash
        run: |
          set -euo pipefail

          git show 4272e0676bd44369cc48f8f706936aa49f778c68:tools/migrations/scan-forensic-source.py > tools/migrations/scan-forensic-source.py
          chmod +x tools/migrations/scan-forensic-source.py

          python3 - <<'PY'
          from pathlib import Path

          h1 = Path('scripts/staging2/h1-hubspot-e2e.mjs')
          source = h1.read_text()
          old = """assert.match(\n  conversionEvents,\n  new RegExp(formId),\n  'attribution runtime must remain scoped to the canonical HubSpot form'\n);"""
          new = """assert.match(\n  conversionEvents,\n  /var forms = attributionConfig\\.forms \\|\\| \\{\\};/,\n  'attribution runtime must resolve the canonical HubSpot form from localized configuration'\n);\nassert.match(\n  conversionEvents,\n  /var FORM_ID = String\\(forms\\.valoracion \\|\\| ''\\)\\.toLowerCase\\(\\);/,\n  'attribution runtime must scope Google attribution to forms.valoracion'\n);\nassert.doesNotMatch(\n  conversionEvents,\n  new RegExp(formId),\n  'attribution runtime must not duplicate the canonical HubSpot form ID literal'\n);"""
          if source.count(old) != 1:
              raise SystemExit(f'Expected one stale HubSpot form assertion, found {source.count(old)}')
          h1.write_text(source.replace(old, new, 1))

          contract = Path('scripts/ci/test-release-regression-contract.sh')
          c = contract.read_text()
          variable_anchor = 'WORDPRESS_SECURITY_CONTRACT="$ROOT/scripts/lint/test-wordpress-security-contract.php"\n'
          variable_insert = variable_anchor + 'FORENSIC_SCANNER="$ROOT/tools/migrations/scan-forensic-source.py"\nHUBSPOT_ZERO_SUBMIT_CONTRACT="$ROOT/scripts/staging2/h1-hubspot-e2e.mjs"\n'
          if c.count(variable_anchor) != 1:
              raise SystemExit('release contract variable anchor mismatch')
          c = c.replace(variable_anchor, variable_insert, 1)

          required_old = '"$WORDPRESS_SECURITY_CONTRACT" "$SEO_GEO_AUDIT" "$SEO_TOOLING_DIR/package-lock.json"'
          required_new = '"$WORDPRESS_SECURITY_CONTRACT" "$FORENSIC_SCANNER" "$HUBSPOT_ZERO_SUBMIT_CONTRACT" "$SEO_GEO_AUDIT" "$SEO_TOOLING_DIR/package-lock.json"'
          if c.count(required_old) != 1:
              raise SystemExit('release contract required-file anchor mismatch')
          c = c.replace(required_old, required_new, 1)

          test_anchor = "node \"$VALORACION_FORM_CONTRACT_TEST\" || fail 'valoracion_form_structural_boundary_behavior'\npass_assert 'valoracion-form-structural-boundary'\n"
          test_insert = test_anchor + "\npython3 -m py_compile \"$FORENSIC_SCANNER\" || fail 'forensic_scanner_syntax'\npass_assert 'forensic-scanner-syntax'\n\nEXPECTED_SHA=\"$(git -C \"$ROOT\" rev-parse HEAD)\" node \"$HUBSPOT_ZERO_SUBMIT_CONTRACT\" || fail 'hubspot_zero_submit_contract'\npass_assert 'hubspot-zero-submit-contract'\n"
          if c.count(test_anchor) != 1:
              raise SystemExit('release contract test anchor mismatch')
          contract.write_text(c.replace(test_anchor, test_insert, 1))
          PY

          python3 -m py_compile tools/migrations/scan-forensic-source.py
          EXPECTED_SHA="$(git rev-parse HEAD)" node scripts/staging2/h1-hubspot-e2e.mjs
          bash -n scripts/ci/test-release-regression-contract.sh
          bash scripts/ci/test-release-regression-contract.sh

          rm -f .github/workflows/apply-post-release-audit-tooling-once.yml
          git config user.name 'Nuvanx Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/migrations/scan-forensic-source.py scripts/staging2/h1-hubspot-e2e.mjs scripts/ci/test-release-regression-contract.sh .github/workflows/apply-post-release-audit-tooling-once.yml
          git diff --cached --check
          git commit -m 'fix(audits): restore forensic scanner and align HubSpot contract'
          git push origin HEAD:fix/post-release-audit-tooling-20260827
