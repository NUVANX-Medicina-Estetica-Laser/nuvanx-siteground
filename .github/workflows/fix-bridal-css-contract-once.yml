name: Fix Bridal CSS Contract Once

on:
  push:
    branches:
      - fix/seo-contacto-catalog-parity-20260823
    paths:
      - .github/workflows/fix-bridal-css-contract-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-contacto-catalog-parity-20260823
          fetch-depth: 1

      - name: Restore canonical bridal studio layout contract
        shell: bash
        run: |
          set -euo pipefail
          css='wp-content/themes/nuvanx-medical/assets/css/nvx-components.css'
          php='wp-content/themes/nuvanx-medical/inc/nvx-bridal-page.php'

          grep -Fq 'nvx-bridal-studio__spread' "$php"
          grep -Fq 'nvx-bridal-studio__pair' "$php"
          if grep -Fq '.nvx-bridal-studio__spread' "$css"; then
            echo 'Bridal spread CSS already present; refusing duplicate append.' >&2
            exit 1
          fi

          cat >> "$css" <<'CSS'

/* Bridal editorial studio — canonical matched-spread contract. */
.nvx-bridal-studio__spread {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--nvx-space-6);
  align-items: center;
  margin-bottom: var(--nvx-space-7);
}

.nvx-bridal-studio__copy {
  max-width: 36rem;
}

.nvx-bridal-studio__plate--mood img,
.nvx-bridal-studio__plate--consult img,
.nvx-bridal-studio__plate--brazos img,
.nvx-bridal-studio__plate--espalda img {
  aspect-ratio: 4 / 5;
}

.nvx-bridal-studio__plate--mood img {
  object-position: center top;
}

.nvx-bridal-studio__plate--consult img {
  object-position: center 45%;
}

.nvx-bridal-studio__plate--papada {
  margin: 0 auto var(--nvx-space-7);
}

.nvx-bridal-studio__plate--papada img {
  aspect-ratio: 2 / 1;
  object-position: center;
}

.nvx-bridal-studio__pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--nvx-space-6);
  align-items: start;
  padding-bottom: var(--nvx-space-4);
}

.nvx-bridal-studio__plate--brazos img {
  object-position: center 14%;
}

.nvx-bridal-studio__plate--espalda img {
  object-position: center 28%;
}

@media (max-width: 56rem) {
  .nvx-bridal-studio__spread,
  .nvx-bridal-studio__pair {
    grid-template-columns: 1fr;
    gap: var(--nvx-space-4);
    margin-bottom: var(--nvx-space-6);
  }

  .nvx-bridal-studio__plate--papada {
    margin-bottom: var(--nvx-space-6);
  }
}
CSS

          node scripts/lint/test-lcp-css-delivery.mjs
          node scripts/lint/no-hardcoded-colors.mjs --strict
          node scripts/lint/no-hardcoded-fontsize.mjs
          git diff --check

      - name: Commit validated CSS baseline repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-bridal-css-contract-once.yml
          git config user.name "Nuvanx Bot"
          git config user.email "bot@nuvanx.com"
          git add wp-content/themes/nuvanx-medical/assets/css/nvx-components.css .github/workflows/fix-bridal-css-contract-once.yml
          git diff --cached --check
          git commit -m "fix(css): restore bridal matched-spread contract"
          git push origin HEAD:fix/seo-contacto-catalog-parity-20260823
