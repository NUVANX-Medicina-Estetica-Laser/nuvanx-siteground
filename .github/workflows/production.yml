name: Production
run-name: >-
  Production · ${{ inputs.run_ssh_connectivity_probe && format('SSH connectivity probe · {0}', inputs.candidate_sha) || (inputs.deploy && format('{0} · {1}', inputs.release_mode, inputs.candidate_sha) || format('verification · {0}', inputs.candidate_sha)) }}

on:
  # Production is deliberately manual-only. A successful Staging run proves a
  # candidate is eligible, but it must never constitute release authorization.
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote the exact accepted Staging SHA to production.
        required: true
        default: true
        type: boolean
      candidate_sha:
        description: Exact 40-character SHA with successful immutable Staging acceptance evidence. Normal releases must use the current master HEAD.
        required: true
        type: string
      release_mode:
        description: Use rollback only for an intentional historical release; normal requires the current master HEAD.
        required: true
        default: release
        type: choice
        options:
          - release
          - rollback
      run_post_audits:
        description: Run SEO/GEO, Search Console URL Inspection and IndexNow verification/submission.
        required: true
        default: true
        type: boolean
      run_performance:
        description: Run the Lighthouse production matrix.
        required: true
        default: false
        type: boolean
      run_hubspot_e2e:
        description: Run the zero-submit production HubSpot verification contract.
        required: true
        default: false
        type: boolean
      run_ssh_connectivity_probe:
        description: Verify production SSH connectivity only. This mode never performs preflight, payload upload, cutover, audits or runtime mutation.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

# Each run owns a unique GitHub concurrency group. Cross-workflow mutation order
# is enforced by scripts/ci/wait-for-environment-mutation-turn.sh so a newer run
# cannot replace an older pending SHA in GitHub's single-pending concurrency slot.
concurrency:
  group: ${{ format('nuvanx-mutation-run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PROD_ROOT: /home/customer/www/nuvanx.com/public_html
  PROD_PARENT: /home/customer/www/nuvanx.com
  PROD_DB_NAME: ${{ secrets.PROD_DB_NAME || vars.PROD_DB_NAME || 'db0ecrycwv2tgb' }}
  BASE_URL: https://nuvanx.com
  EXPECTED_HOST: nuvanx.com
  SEARCH_CONSOLE_PROPERTY: https://nuvanx.com/
  INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
  STAGING_ACCEPTANCE_BRANCH: master
  STAGING_ACCEPTANCE_WORKFLOW_PATH: .github/workflows/staging.yml
  SSH_RETRY_ATTEMPTS: 5
  SSH_RETRY_BASE_DELAY_SECONDS: 15
  SSH_TRANSPORT_EXIT_CODE: 255

jobs:
  release:
    name: Promote immutable accepted SHA
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy || inputs.run_ssh_connectivity_probe) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 105
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Check out release control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release control plane
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/wait-for-environment-mutation-turn.sh
          bash -n scripts/ci/verify-staging-acceptance.sh
          bash -n scripts/ci/test-mutation-fifo-contract.sh
          bash -n scripts/ci/test-siteground-cache-owner.sh
          bash scripts/ci/test-mutation-fifo-contract.sh
          bash scripts/ci/test-siteground-cache-owner.sh
          node scripts/production/test-deploy-identity-contract.mjs
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          [[ "${workflows[*]}" == 'production.yml staging.yml' ]] || { printf 'Expected exactly two canonical workflows; found: %s\n' "${workflows[*]}" >&2; exit 1; }
          ! grep -Fq 'StrictHostKeyChecking=no' .github/workflows/production.yml
          bash -n scripts/production/compensating-rollback.sh
          bash -n scripts/production/configure-siteground-ssh.sh
          bash -n scripts/production/test-configure-siteground-ssh.sh
          bash scripts/production/test-configure-siteground-ssh.sh
          grep -Fq 'PRODUCTION_COMPENSATING_ROLLBACK=PASS' scripts/production/compensating-rollback.sh
          echo 'PRODUCTION_CONTROL_PLANE=PASS workflows=2 compensating_rollback=enforced cache_owner=canonical identity_contract=pass'

      - name: Resolve immutable requested candidate
        id: candidate
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          candidate="$(printf '%s' "$REQUESTED_SHA" | tr -d '[:space:]')"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full lowercase 40-character SHA.' >&2; exit 1; }
          [[ "$RELEASE_MODE" == 'release' || "$RELEASE_MODE" == 'rollback' ]] || { echo "Invalid release_mode: $RELEASE_MODE" >&2; exit 1; }
          git fetch --no-tags origin "$STAGING_ACCEPTANCE_BRANCH"
          branch_head="$(git rev-parse "origin/$STAGING_ACCEPTANCE_BRANCH")"
          git cat-file -e "${candidate}^{commit}"
          git merge-base --is-ancestor "$candidate" "origin/$STAGING_ACCEPTANCE_BRANCH" || { echo "Candidate is outside origin/$STAGING_ACCEPTANCE_BRANCH: $candidate" >&2; exit 1; }
          if [[ "$RELEASE_MODE" == 'release' && "$candidate" != "$branch_head" ]]; then
            echo "PRODUCTION_FRESHNESS=FAIL requested_sha=$candidate current_${STAGING_ACCEPTANCE_BRANCH}_head=$branch_head action=use_current_head_or_explicit_rollback" >&2
            exit 1
          fi
          git cat-file -e "${candidate}:wp-content/themes/nuvanx-medical/functions.php"
          theme_tree="$(git rev-parse "${candidate}:wp-content/themes/nuvanx-medical")"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=$candidate" >> "$GITHUB_ENV"
          echo "CANDIDATE_THEME_TREE=$theme_tree" >> "$GITHUB_ENV"
          echo "PRODUCTION_CANDIDATE=$candidate"
          echo "PRODUCTION_CANDIDATE_THEME_TREE=$theme_tree"
          echo "PRODUCTION_RELEASE_MODE=$RELEASE_MODE"
          echo "PRODUCTION_FRESHNESS=PASS mode=$RELEASE_MODE candidate=$candidate current_${STAGING_ACCEPTANCE_BRANCH}_head=$branch_head"

      - name: Verify successful exact-SHA Staging acceptance evidence
        id: acceptance
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-staging-acceptance.sh

      - name: Materialize and validate exact candidate tooling
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}

        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_ROOT="$RUNNER_TEMP/production-candidate-$CANDIDATE_SHA"
          git worktree add --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$CANDIDATE_SHA"
          find "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical" -path '*/vendor' -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          bash -n "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          if [[ "$RELEASE_MODE" != 'rollback' ]]; then
            test -s "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh"
            bash -n "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh"
            ! grep -Eq 'wp[[:space:]]+sg[[:space:]]+purge' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
            grep -Fq 'siteground_cache_purge "$PROD_ROOT" preserve' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          elif [[ -f "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh" ]]; then
            bash -n "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh"
          fi
          node --check "$CANDIDATE_ROOT/scripts/production/deploy-identity-contract.mjs"
          node --check "$CANDIDATE_ROOT/scripts/production/signature-frame-contract.mjs"
          node --check "$CANDIDATE_ROOT/scripts/production/verify-production-boundary.mjs"
          node --check "$CANDIDATE_ROOT/scripts/production/verify-production-identity.mjs"
          node "$CANDIDATE_ROOT/scripts/production/test-deploy-identity-contract.mjs"
          node "$CANDIDATE_ROOT/scripts/production/test-signature-frame-contract.mjs"
          node --check "$CANDIDATE_ROOT/scripts/seo/index-pages.js"
          bash -n "$CANDIDATE_ROOT/scripts/production/document-head-title-audit.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/seo-geo-origin-audit.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/diagnose-title-emitters.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/compensating-rollback.sh"
          bash -n "$CANDIDATE_ROOT/scripts/production/indexnow-submit-sitemap.sh"
          grep -Fq 'ROLLBACK_SNAPSHOT=PASS' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          grep -Fq 'ROLLBACK_PRODUCTION=PASS' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          grep -Fq 'PRODUCTION_COMPENSATING_ROLLBACK=PASS' "$CANDIDATE_ROOT/scripts/production/compensating-rollback.sh"
          grep -Fq '.nvx-deploy-sha' "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh"
          echo "CANDIDATE_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "AUDIT_ROOT=$CANDIDATE_ROOT" >> "$GITHUB_ENV"
          echo "CANONICAL_AUDIT_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "PRODUCTION_EXACT_TOOLING=PASS sha=$CANDIDATE_SHA compensating_rollback=enforced cache_owner=canonical identity_contract=pass"

      - name: Wait for FIFO environment mutation turn
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_ROLE: production
          MUTATION_WAIT_MAX_SECONDS: 3600
        run: bash scripts/ci/wait-for-environment-mutation-turn.sh

      - name: Configure strict production SSH
        shell: bash
        env:
          NVX_SSH_ALIAS: nvx-prod
          NVX_SSH_KEY_BASENAME: prod_key
          PRIMARY_HOST: ${{ secrets.PROD_SSH_HOST }}
          PRIMARY_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRIMARY_USER: ${{ secrets.PROD_SSH_USER }}
          PRIMARY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRIMARY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          FALLBACK_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          FALLBACK_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          FALLBACK_USER: ${{ secrets.STAGING2_SSH_USER }}
          FALLBACK_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          FALLBACK_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: bash scripts/production/configure-siteground-ssh.sh

      - name: Verify production SSH connectivity only
        if: ${{ inputs.run_ssh_connectivity_probe }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod true
          echo 'PRODUCTION_SSH_CONNECTIVITY=PASS'

      - name: Verify production preflight
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        run: |
          set -euo pipefail
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' PROD_DB_NAME='$PROD_DB_NAME' BASE_URL='$BASE_URL' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          command -v wp >/dev/null
          command -v rsync >/dev/null
          command -v php >/dev/null
          command -v curl >/dev/null
          test "$(wp config get DB_NAME)" = "$PROD_DB_NAME"
          test "$(wp option get home)" = "$BASE_URL"
          test "$(wp option get siteurl)" = "$BASE_URL"
          test "$(wp option get blog_public)" = '1'
          test "$(wp theme list --status=active --field=name)" = 'nuvanx-medical'
          echo 'PRODUCTION_PREFLIGHT=PASS'
          REMOTE

      - name: Upload exact accepted payload and tooling
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          REMOTE_RELEASE="$PROD_PARENT/.nvx-releases/${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REMOTE_RELEASE=$REMOTE_RELEASE" >> "$GITHUB_ENV"
          ssh nvx-prod "mkdir -p '$REMOTE_RELEASE/theme' '$REMOTE_RELEASE/tools/migrations' '$REMOTE_RELEASE/lib'"
          rsync -az --delete --exclude='.git' --exclude='php_errorlog' --exclude='*.log' --exclude='_archive*' --exclude='_disabled*' --exclude='*.bak*' "$CANDIDATE_ROOT/wp-content/themes/nuvanx-medical/" "nvx-prod:$REMOTE_RELEASE/theme/"
          rsync -az "$CANDIDATE_ROOT/tools/deploy/deploy-to-prod.sh" "nvx-prod:$REMOTE_RELEASE/deploy-to-prod.sh"
          if test -f "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh"; then
            rsync -az "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh" "nvx-prod:$REMOTE_RELEASE/siteground-cache-purge.sh"
          fi
          rsync -az "$CANDIDATE_ROOT/lib/" "nvx-prod:$REMOTE_RELEASE/lib/"
          # Keep the release payload in lockstep with deploy-to-prod.sh. The deploy
          # script owns the exact migration set; synchronizing the whole accepted
          # directory prevents future required migrations from being omitted here.
          rsync -az --delete "$CANDIDATE_ROOT/tools/migrations/" "nvx-prod:$REMOTE_RELEASE/tools/migrations/"
          required_migrations=(
            audit-content-divergence.php
            content-hygiene-shared.php
            governed-blog-markdown-hygiene.php
            content-normalizer.php
            reconcile-publication-robots.php
            reconcile-publication-indexables.php
            run-yoast-indexable-rebuild.php
            audit-publication-sitemap-selection.php
            invalidate-publication-sitemap-cache.php
          )
          for migration in "${required_migrations[@]}"; do
            if ! test -s "$CANDIDATE_ROOT/tools/migrations/$migration"; then
              echo "PRODUCTION_MIGRATION_PAYLOAD=FAIL reason=missing_local_migration file=$migration" >&2
              exit 1
            fi
          done
          remote_tests=""
          for migration in "${required_migrations[@]}"; do
            remote_tests+="test -s '$REMOTE_RELEASE/tools/migrations/$migration' && "
          done
          remote_tests=${remote_tests% && }
          ssh nvx-prod "$remote_tests"
          if [[ -f "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh" ]]; then
            local_helper_sha="$(sha256sum "$CANDIDATE_ROOT/tools/deploy/siteground-cache-purge.sh" | cut -d' ' -f1)"
            remote_helper_sha="$(ssh nvx-prod "test -s '$REMOTE_RELEASE/siteground-cache-purge.sh' && bash -n '$REMOTE_RELEASE/siteground-cache-purge.sh' && sha256sum '$REMOTE_RELEASE/siteground-cache-purge.sh' | cut -d' ' -f1")"
            [[ "$local_helper_sha" =~ ^[0-9a-f]{64}$ && "$remote_helper_sha" == "$local_helper_sha" ]] || {
              echo "PRODUCTION_CACHE_HELPER_PAYLOAD=FAIL local=${local_helper_sha:-missing} remote=${remote_helper_sha:-missing}" >&2
              exit 1
            }
            echo "PRODUCTION_CACHE_HELPER_PAYLOAD=PASS sha256=$local_helper_sha exact_sha=$CANDIDATE_SHA"
          else
            echo "PRODUCTION_CACHE_HELPER_PAYLOAD=PASS legacy_sha=$CANDIDATE_SHA"
          fi
          echo "PRODUCTION_MIGRATION_PAYLOAD=PASS required=${#required_migrations[@]} exact_sha=$CANDIDATE_SHA"
          echo "PRODUCTION_PAYLOAD=PASS exact_sha=$CANDIDATE_SHA"

      - name: Execute guarded atomic production cutover
        id: cutover
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          ssh nvx-prod "NVX_RUN_TOKEN='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' GITHUB_RUN_ID='${GITHUB_RUN_ID}' NUVANX_CONFIRM=yes bash '$REMOTE_RELEASE/deploy-to-prod.sh' --prod-root '$PROD_ROOT' --source-theme '$REMOTE_RELEASE/theme' --sha '$CANDIDATE_SHA' --confirm"

      - name: Verify production public boundary and exact disk SHA
        id: production_boundary
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          pass=0
          for attempt in {1..6}; do
            if BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$CANDIDATE_SHA" EXPECTED_RUN_ID="$GITHUB_RUN_ID" ORIGIN_SSH_ALIAS=nvx-prod PROD_DB_NAME="$PROD_DB_NAME" PRODUCTION_BOUNDARY_ARTIFACTS_DIR="$GITHUB_WORKSPACE/scripts/production/artifacts" node "$CANDIDATE_ROOT/scripts/production/verify-production-boundary.mjs"; then pass=1; break; fi
            sleep 10
          done
          test "$pass" = 1
          mkdir -p "$GITHUB_WORKSPACE/scripts/production/artifacts"
          cp -f "$CANDIDATE_ROOT/scripts/production/artifacts/production-boundary.json" "$GITHUB_WORKSPACE/scripts/production/artifacts/" 2>/dev/null || true
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' CANDIDATE_SHA='$CANDIDATE_SHA' PROD_DB_NAME='$PROD_DB_NAME' BASE_URL='$BASE_URL' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$PROD_ROOT"
          test "$(tr -d '\r\n' < wp-content/themes/nuvanx-medical/.nvx-deploy-sha)" = "$CANDIDATE_SHA"
          test -f "wp-content/themes/nuvanx-medical/.nvx-deploy-stamp.json"
          test "$(wp config get DB_NAME)" = "$PROD_DB_NAME"
          test "$(wp option get home)" = "$BASE_URL"
          test "$(wp option get siteurl)" = "$BASE_URL"
          test "$(wp option get blog_public)" = '1'
          echo "PRODUCTION_DEPLOYED_SHA=$CANDIDATE_SHA"
          REMOTE

      - name: Verify full production identity chain (4-field verification)
        id: production_identity
        if: ${{ !inputs.run_ssh_connectivity_probe }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          ORIGIN_SSH_ALIAS=nvx-prod EXPECTED_RUN_ID="$GITHUB_RUN_ID" EXPECTED_SHA="$CANDIDATE_SHA" node "$CANDIDATE_ROOT/scripts/production/verify-production-identity.mjs"
          mkdir -p "$GITHUB_WORKSPACE/scripts/production/artifacts"
          cp -f "$CANDIDATE_ROOT/scripts/production/artifacts/production-identity-verification.json" "$GITHUB_WORKSPACE/scripts/production/artifacts/" 2>/dev/null || true
          echo "PRODUCTION_IDENTITY_CHAIN=PASS"

      - name: Run exact-candidate production origin audits
        id: origin_audits
        if: ${{ !inputs.run_ssh_connectivity_probe && inputs.run_post_audits }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p scripts/production/artifacts scripts/seo/artifacts
          ssh nvx-prod "BASE_URL='$BASE_URL' bash -s" < "$CANDIDATE_ROOT/scripts/production/document-head-title-audit.sh" | tee scripts/production/artifacts/document-head-title-audit.log
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" < "$CANDIDATE_ROOT/scripts/production/seo-geo-origin-audit.sh" | tee scripts/production/artifacts/seo-geo-origin-audit.log

          log='scripts/production/artifacts/seo-geo-origin-audit.log'
          out='scripts/seo/artifacts/sitemap-urls.txt'
          expected="$(sed -nE 's/^PASS SITEMAP_URL_COUNT count=([0-9]+)$/\1/p' "$log" | tail -n1)"
          grep '^PASS URL_SEO url=' "$log" | sed -E 's/^PASS URL_SEO url=([^ ]+) .*/\1/' > "$out" || true
          base_prefix="${BASE_URL%/}/"
          base_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$BASE_URL")"
          [[ -n "$base_prefix" && "$base_host" == "$EXPECTED_HOST" ]] || { echo "GSC_URL_INVENTORY=FAIL base_url=$BASE_URL base_host=${base_host:-missing} expected_host=$EXPECTED_HOST" >&2; exit 1; }
          actual="$(awk -v prefix="$base_prefix" 'index($0, prefix) == 1 { count++ } END { print count + 0 }' "$out")"
          [[ "$expected" =~ ^[0-9]+$ && "$actual" =~ ^[0-9]+$ && "$actual" -eq "$expected" && "$actual" -gt 0 ]] || { echo "GSC_URL_INVENTORY=FAIL expected=${expected:-missing} actual=$actual" >&2; exit 1; }
          [[ "$(sort -u "$out" | wc -l | tr -d ' ')" -eq "$actual" ]] || { echo 'GSC_URL_INVENTORY=FAIL duplicate_urls' >&2; exit 1; }

          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' INDEXNOW_KEY='$INDEXNOW_KEY' bash -s" < "$CANDIDATE_ROOT/scripts/production/indexnow-submit-sitemap.sh" | tee scripts/production/artifacts/indexnow-submit.log
          echo "PRODUCTION_ORIGIN_AUDITS=PASS urls=$actual tooling_sha=$CANDIDATE_SHA"

      - name: Diagnose exact-candidate title emitters after audit failure
        if: ${{ always() && steps.origin_audits.outcome == 'failure' }}
        shell: bash
        run: |
          set +e
          if [[ -f "$HOME/.ssh/config" && -n "${CANDIDATE_ROOT:-}" ]]; then
            ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' bash -s" < "$CANDIDATE_ROOT/scripts/production/diagnose-title-emitters.sh" | tee scripts/production/artifacts/title-emitter-diagnostic.log
          fi
          exit 0

      - name: Compensate failed post-cutover production gate
        id: compensating_rollback
        if: ${{ !inputs.run_ssh_connectivity_probe && always() && steps.cutover.outcome == 'success' && (steps.production_boundary.outcome == 'failure' || steps.production_identity.outcome == 'failure' || steps.origin_audits.outcome == 'failure') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p scripts/production/artifacts
          test -f "$HOME/.ssh/config"
          test -n "${CANDIDATE_ROOT:-}"
          test -n "${REMOTE_RELEASE:-}"
          ssh nvx-prod "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' SITEGROUND_CACHE_HELPER='$REMOTE_RELEASE/siteground-cache-purge.sh' bash -s" < "$CANDIDATE_ROOT/scripts/production/compensating-rollback.sh" | tee scripts/production/artifacts/compensating-rollback.log
          grep -Fq 'PRODUCTION_COMPENSATING_CACHE=PASS' scripts/production/artifacts/compensating-rollback.log
          grep -Fq 'PRODUCTION_COMPENSATING_ROLLBACK=PASS' scripts/production/artifacts/compensating-rollback.log
          echo 'PRODUCTION_POST_CUTOVER_COMPENSATION=PASS cache_owner=canonical'

      - name: Upload production boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-boundary-${{ env.CANDIDATE_SHA }}-attempt-${{ github.run_attempt }}
          path: scripts/production/artifacts/production-boundary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload production origin audit evidence
        if: ${{ always() && (inputs.run_post_audits || steps.production_boundary.outcome == 'failure' || steps.production_identity.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-origin-audit-${{ env.CANDIDATE_SHA }}
          path: |
            scripts/production/artifacts/*.log
            scripts/seo/artifacts/sitemap-urls.txt
          retention-days: 30
          # This runs after a failed or skipped audit so it must not mask the
          # original failure when no audit evidence was produced.
          if-no-files-found: warn
          compression-level: 6
          overwrite: true

      - name: Cleanup production release payload and identities
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${REMOTE_RELEASE:-}" && -f "$HOME/.ssh/config" ]]; then ssh nvx-prod "rm -rf '$REMOTE_RELEASE'" || true; fi
          rm -f "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
          [[ -z "${CANDIDATE_ROOT:-}" ]] || git worktree remove --force "$CANDIDATE_ROOT" 2>/dev/null || true

      - name: Write release summary
        if: ${{ success() && !inputs.run_ssh_connectivity_probe }}
        shell: bash
        run: |
          {
            echo '## Production release PASS'
            echo
            echo '- Candidate authority: immutable successful Staging acceptance artifact.'
            echo "- Exact SHA: \`$CANDIDATE_SHA\`"
            echo "- Theme tree: \`$CANDIDATE_THEME_TREE\`"
            echo "- Deploy/audit tooling SHA: \`$CANONICAL_AUDIT_SHA\`"
            echo '- FIFO lease prevented newer Staging/Production mutations from overtaking this release.'
            echo '- Atomic production cutover + rollback contract: PASS.'
            echo '- Canonical SiteGround cache owner + exact helper lineage: PASS.'
            echo '- Four-field production identity: PASS.'
            echo '- Post-cutover boundary/origin/identity failure compensation: enforced.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write SSH connectivity probe summary
        if: ${{ success() && inputs.run_ssh_connectivity_probe }}
        shell: bash
        run: |
          {
            echo '## Production SSH Connectivity Probe PASS'
            echo
            echo '- Production SSH configuration and transport are healthy.'
            echo '- No deployments, mutations, or runtime validations were executed.'
          } >> "$GITHUB_STEP_SUMMARY"

  post_audits:
    name: Production SEO/GEO, GSC and IndexNow
    needs: release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.run_ssh_connectivity_probe &&
      inputs.run_post_audits &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Check out exact candidate audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate tooling identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(printf '%s' "$CANDIDATE_SHA" | tr -d '[:space:]')"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$candidate"
          node scripts/production/test-deploy-identity-contract.mjs
          echo "POST_AUDIT_TOOLING=PASS sha=$candidate"

      - name: Setup Node.js for Search Console audit
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Search Console audit dependencies
        shell: bash
        run: npm ci --prefix scripts/seo --ignore-scripts

      - name: Download release origin audit evidence
        if: ${{ inputs.deploy }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: production-origin-audit-${{ needs.release.outputs.candidate_sha }}
          path: scripts

      - name: Validate release origin evidence handoff
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/production/artifacts/document-head-title-audit.log
          test -s scripts/production/artifacts/seo-geo-origin-audit.log
          test -s scripts/production/artifacts/indexnow-submit.log
          test -s scripts/seo/artifacts/sitemap-urls.txt
          grep -Fq 'DOCUMENT_HEAD_TITLE_AUDIT=PASS' scripts/production/artifacts/document-head-title-audit.log
          grep -Fq 'SEO_GEO_ORIGIN_AUDIT=PASS' scripts/production/artifacts/seo-geo-origin-audit.log
          grep -Fq 'INDEXNOW_SUBMIT=PASS' scripts/production/artifacts/indexnow-submit.log
          echo "RELEASE_ORIGIN_EVIDENCE=PASS urls=$(wc -l < scripts/seo/artifacts/sitemap-urls.txt | tr -d ' ')"

      - name: Wait for FIFO environment turn (verification only)
        if: ${{ inputs.deploy == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_ROLE: production-verification
          MUTATION_WAIT_MAX_SECONDS: 1800
        run: bash scripts/ci/wait-for-environment-mutation-turn.sh

      - name: Configure verification-only production audit SSH
        if: ${{ inputs.deploy == false }}
        shell: bash
        env:
          NVX_SSH_ALIAS: nvx-prod-audit
          NVX_SSH_KEY_BASENAME: prod_audit_key
          PRIMARY_HOST: ${{ secrets.PROD_SSH_HOST }}
          PRIMARY_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRIMARY_USER: ${{ secrets.PROD_SSH_USER }}
          PRIMARY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRIMARY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          FALLBACK_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          FALLBACK_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          FALLBACK_USER: ${{ secrets.STAGING2_SSH_USER }}
          FALLBACK_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          FALLBACK_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p scripts/production/artifacts scripts/seo/artifacts
          bash -n scripts/production/configure-siteground-ssh.sh
          bash scripts/production/configure-siteground-ssh.sh

      - name: Run verification-only exact-candidate boundary and origin audits
        if: ${{ inputs.deploy == false }}
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN_SSH_ALIAS=nvx-prod-audit PROD_DB_NAME="$PROD_DB_NAME" BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$CANDIDATE_SHA" node scripts/production/verify-production-boundary.mjs
          ssh nvx-prod-audit "BASE_URL='$BASE_URL' bash -s" < scripts/production/document-head-title-audit.sh | tee scripts/production/artifacts/document-head-title-audit.log
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' bash -s" < scripts/production/seo-geo-origin-audit.sh | tee scripts/production/artifacts/seo-geo-origin-audit.log
          log='scripts/production/artifacts/seo-geo-origin-audit.log'
          out='scripts/seo/artifacts/sitemap-urls.txt'
          expected="$(sed -nE 's/^PASS SITEMAP_URL_COUNT count=([0-9]+)$/\1/p' "$log" | tail -n1)"
          grep '^PASS URL_SEO url=' "$log" | sed -E 's/^PASS URL_SEO url=([^ ]+) .*/\1/' > "$out" || true
          base_prefix="${BASE_URL%/}/"
          base_host="$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$BASE_URL")"
          [[ -n "$base_prefix" && "$base_host" == "$EXPECTED_HOST" ]] || { echo "GSC_URL_INVENTORY=FAIL base_url=$BASE_URL base_host=${base_host:-missing} expected_host=$EXPECTED_HOST" >&2; exit 1; }
          actual="$(awk -v prefix="$base_prefix" 'index($0, prefix) == 1 { count++ } END { print count + 0 }' "$out")"
          [[ "$expected" =~ ^[0-9]+$ && "$actual" =~ ^[0-9]+$ && "$actual" -eq "$expected" && "$actual" -gt 0 ]] || { echo "GSC_URL_INVENTORY=FAIL expected=${expected:-missing} actual=$actual" >&2; exit 1; }
          [[ "$(sort -u "$out" | wc -l | tr -d ' ')" -eq "$actual" ]] || { echo 'GSC_URL_INVENTORY=FAIL duplicate_urls' >&2; exit 1; }
          ssh nvx-prod-audit "PROD_ROOT='$PROD_ROOT' BASE_URL='$BASE_URL' EXPECTED_HOST='$EXPECTED_HOST' INDEXNOW_KEY='$INDEXNOW_KEY' bash -s" < scripts/production/indexnow-submit-sitemap.sh | tee scripts/production/artifacts/indexnow-submit.log
          echo "VERIFICATION_ORIGIN_AUDITS=PASS urls=$actual sha=$CANDIDATE_SHA"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: gcp_wif_auth
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT != '' }}
        # continue-on-error: a WIF attribute-condition rejection (unauthorized_client) must not
        # fail the SEO/GEO job. The next step resolves auth mode and sets enabled=false when
        # WIF auth outcome is not success, skipping all GCP-gated steps gracefully.
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: nuvanx
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Resolve Search Console authentication
        id: gsc_auth
        shell: bash
        env:
          WIF_AUTH_OUTCOME: ${{ steps.gcp_wif_auth.outcome }}
          STATIC_SEARCH_CONSOLE_JSON: ${{ secrets.SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          rm -f scripts/seo/credentials.json
          if [[ "${WIF_AUTH_OUTCOME:-}" == 'failure' ]]; then
            echo 'SEARCH_CONSOLE_AUTH=SKIPPED wif_auth_failure_degraded'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          elif [[ "${WIF_AUTH_OUTCOME:-}" == 'success' && -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -s "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo 'SEARCH_CONSOLE_AUTH=WIF_ADC'
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$STATIC_SEARCH_CONSOLE_JSON" ]]; then
            printf '%s' "$STATIC_SEARCH_CONSOLE_JSON" > scripts/seo/credentials.json
            chmod 600 scripts/seo/credentials.json
            jq -e '.type == "service_account" and (.client_email | type == "string" and length > 0) and (.private_key | type == "string" and length > 0)' scripts/seo/credentials.json >/dev/null
            echo 'SEARCH_CONSOLE_AUTH=SERVICE_ACCOUNT_JSON_FALLBACK'
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'SEARCH_CONSOLE_AUTH=SKIPPED no_credentials_configured'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect exact production sitemap URLs in Google Search Console
        if: steps.gsc_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/seo/index-pages.js --property "$SEARCH_CONSOLE_PROPERTY" --url "$BASE_URL" --urls-file scripts/seo/artifacts/sitemap-urls.txt 2>&1 | tee scripts/seo/artifacts/url-inspection.log
          grep -Fq 'INSPECTION_COMPLETED=true' scripts/seo/artifacts/url-inspection.log
          total="$(sed -nE 's/^TOTAL_URLS=([0-9]+)$/\1/p' scripts/seo/artifacts/url-inspection.log | tail -n1)"
          api_errors="$(sed -nE 's/^API_ERRORS=([0-9]+)$/\1/p' scripts/seo/artifacts/url-inspection.log | tail -n1)"
          inventory="$(wc -l < scripts/seo/artifacts/sitemap-urls.txt | tr -d ' ')"
          [[ "$total" =~ ^[0-9]+$ && "$total" -eq "$inventory" ]] || { echo "GSC_INSPECTION=FAIL total=${total:-missing} inventory=$inventory" >&2; exit 1; }
          [[ "$api_errors" == '0' ]] || { echo "GSC_INSPECTION=FAIL api_errors=${api_errors:-missing}" >&2; exit 1; }
          echo "GSC_INSPECTION=PASS urls=$total api_errors=0"

      - name: Export Search Console URL-level CSV evidence
        if: always() && steps.gsc_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          json='scripts/seo/artifacts/indexing-results.json'
          csv='scripts/seo/artifacts/indexing-results.csv'
          if [[ -s "$json" ]]; then
            jq -r '(["url","apiStatus","verdict","coverageState","indexingState","robotsTxtState","pageFetchState","lastCrawlTime","crawledAs","userCanonical","googleCanonical","blocked","canonicalMismatch","referringUrls","sitemap"] | @csv), (.results[] | [.url,.apiStatus,(.verdict // ""),(.coverageState // ""),(.indexingState // ""),(.robotsTxtState // ""),(.pageFetchState // ""),(.lastCrawlTime // ""),(.crawledAs // ""),(.userCanonical // ""),(.googleCanonical // ""),(.blocked // false),(.canonicalMismatch // false),((.referringUrls // []) | join(" | ")),((.sitemap // []) | join(" | "))] | @csv)' "$json" > "$csv"
            echo "GSC_CSV=PASS rows=$(($(wc -l < "$csv") - 1))"
          else
            echo 'GSC_CSV=SKIPPED no_indexing_results' >&2
          fi

      - name: Verify public IndexNow key with origin fallback
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners can receive SiteGround Anti-Bot HTTP 202
          # (sg-captcha=challenge) on the public hostname. That is not a PASS
          # by itself. The cutover already curls the same public URL from the
          # SiteGround host (non-loopback). Reuse that public-edge evidence.
          accept_siteground_public_edge_evidence() {
            local origin_log='scripts/production/artifacts/indexnow-submit.log'
            [[ -s "$origin_log" ]] || { echo "INDEXNOW_KEY_PUBLIC=FAIL reason=$1 origin_evidence=missing" >&2; exit 1; }
            grep -Fq "PASS INDEXNOW_KEY_FILE path=/$INDEXNOW_KEY.txt" "$origin_log"
            grep -Fq 'INDEXNOW_SUBMIT=PASS' "$origin_log"
          }
          public_url="$BASE_URL/$INDEXNOW_KEY.txt"
          response_file="$RUNNER_TEMP/indexnow-public-key.txt"
          header_file="$RUNNER_TEMP/indexnow-public-key.headers"
          transport_error="$RUNNER_TEMP/indexnow-public-key.err"
          rm -f "$response_file" "$header_file" "$transport_error"
          set +e
          http_code="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 45 --connect-timeout 5 --max-time 15 --proto '=https' --proto-redir '=https' -D "$header_file" -o "$response_file" -w '%{http_code}' "$public_url" 2>"$transport_error")"
          curl_rc=$?
          set -e
          sg_captcha="$(awk 'BEGIN{IGNORECASE=1} /^sg-captcha:/{print $2; exit}' "$header_file" 2>/dev/null | tr -d '\r')"
          if (( curl_rc == 0 )) && [[ "$http_code" == '200' ]]; then
            [[ "$(tr -d '\r\n' < "$response_file")" == "$INDEXNOW_KEY" ]] || { echo 'INDEXNOW_KEY_PUBLIC=FAIL reason=content_mismatch' >&2; exit 1; }
            echo 'INDEXNOW_KEY_PUBLIC=PASS source=public-edge'
          elif (( curl_rc == 0 )) && { [[ "$http_code" == '202' ]] || [[ "${sg_captcha,,}" == 'challenge' ]]; }; then
            accept_siteground_public_edge_evidence "github_runner_challenge status=$http_code sg-captcha=${sg_captcha:-none}"
            echo "INDEXNOW_KEY_PUBLIC=PASS source=siteground-public-edge github_runner_status=$http_code"
          elif (( curl_rc != 0 )); then
            accept_siteground_public_edge_evidence "transport curl_rc=$curl_rc"
            echo 'INDEXNOW_KEY_PUBLIC=UNVERIFIED_TRANSPORT origin_evidence=PASS'
          else
            echo "INDEXNOW_KEY_PUBLIC=FAIL reason=http_status status=$http_code" >&2
            exit 1
          fi

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-post-audits-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            scripts/production/artifacts/*.log
            scripts/seo/artifacts/sitemap-urls.txt
            scripts/seo/artifacts/url-inspection.log
            scripts/seo/artifacts/indexing-results.json
            scripts/seo/artifacts/indexing-results.csv
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Cleanup audit identities and temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/prod_audit_key" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config" scripts/seo/credentials.json
          find . -maxdepth 2 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true

  performance:
    name: Lighthouse production matrix
    needs: release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.run_ssh_connectivity_probe &&
      inputs.run_performance &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Configure verification-only production SSH
        shell: bash
        env:
          NVX_SSH_ALIAS: nvx-prod-audit
          NVX_SSH_KEY_BASENAME: prod_audit_key
          PRIMARY_HOST: ${{ secrets.PROD_SSH_HOST }}
          PRIMARY_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRIMARY_USER: ${{ secrets.PROD_SSH_USER }}
          PRIMARY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRIMARY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          FALLBACK_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          FALLBACK_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          FALLBACK_USER: ${{ secrets.STAGING2_SSH_USER }}
          FALLBACK_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          FALLBACK_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: bash scripts/production/configure-siteground-ssh.sh

      - name: Verify production is exact requested SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: ORIGIN_SSH_ALIAS=nvx-prod-audit PROD_DB_NAME="$PROD_DB_NAME" BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$CANDIDATE_SHA" node scripts/production/verify-production-boundary.mjs

      - name: Run Lighthouse production matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund lighthouse@12.8.2 >/dev/null 2>&1
          LH='./node_modules/.bin/lighthouse'
          "$LH" --version | tee perf-results/lighthouse-version.txt
          declare -A URLS=(
            [home]='https://nuvanx.com/'
            [endolift]='https://nuvanx.com/endolift-facial-papada-mandibula/'
            [endolaser]='https://nuvanx.com/endolaser-corporal-grasa-localizada/'
            [faciales]='https://nuvanx.com/medicina-estetica/'
            [valoracion]='https://nuvanx.com/madrid/valoracion/'
          )
          printf 'page\tmode\tperformance\tfcp_ms\tlcp_ms\ttbt_ms\tcls\tspeed_index_ms\tttfb_ms\tantibot_detected\n' > perf-results/summary.tsv
          printf 'page\tmode\treason\n' > perf-results/failures.tsv
          matrix_failures=0
          for page in home endolift endolaser faciales valoracion; do
            for mode in mobile desktop; do
              out="perf-results/${page}-${mode}.json"; extra=(); [[ "$mode" != desktop ]] || extra+=(--preset=desktop)
              success=0
              antibot_detected=0
              for attempt in 1 2 3; do
                # Check for SiteGround Anti-Bot before Lighthouse run
                antibot_check="$RUNNER_TEMP/antibot-${page}-${mode}-${attempt}.txt"
                set +e
                curl -sS -D "$antibot_check.headers" -o "$antibot_check.body" "${URLS[$page]}" 2>/dev/null
                curl_rc=$?
                set -e
                if (( curl_rc == 0 )); then
                  http_code=$(awk '/^HTTP/{print $2}' "$antibot_check.headers" 2>/dev/null || echo "000")
                  sg_captcha=$(awk 'BEGIN{IGNORECASE=1} /^sg-captcha:/{print $2; exit}' "$antibot_check.headers" 2>/dev/null | tr -d '\r')
                  if [[ "$http_code" == '202' ]] || [[ "${sg_captcha,,}" == 'challenge' ]]; then
                    antibot_detected=1
                    echo "ANTIBOT_DETECTED page=$page mode=$mode attempt=$attempt http=$http_code sg-captcha=${sg_captcha:-none}" >&2
                    sleep 30
                    continue
                  fi
                fi

                if "$LH" "${URLS[$page]}" --output=json --output-path="$out" --only-categories=performance --quiet --chrome-flags='--headless --disable-dev-shm-usage' "${extra[@]}"; then success=1; break; fi
                sleep $((attempt * 5))
              done
              if [[ "$success" != 1 ]]; then
                printf '%s\t%s\t%s\n' "$page" "$mode" 'lighthouse_execution_failed_after_3_attempts' >> perf-results/failures.tsv
                matrix_failures=$((matrix_failures + 1))
                continue
              fi
              if ! jq -e '
                (.categories.performance.score | type == "number") and
                (.audits["first-contentful-paint"].numericValue | type == "number") and
                (.audits["largest-contentful-paint"].numericValue | type == "number") and
                (.audits["total-blocking-time"].numericValue | type == "number") and
                (.audits["cumulative-layout-shift"].numericValue | type == "number") and
                (.audits["speed-index"].numericValue | type == "number") and
                (.audits["server-response-time"].numericValue | type == "number")
              ' "$out" >/dev/null; then
                printf '%s\t%s\t%s\n' "$page" "$mode" 'invalid_lighthouse_json' >> perf-results/failures.tsv
                matrix_failures=$((matrix_failures + 1))
                continue
              fi
              jq -r --arg p "$page" --arg m "$mode" --arg a "$antibot_detected" '[$p,$m,((.categories.performance.score)*100|round),(.audits["first-contentful-paint"].numericValue|round),(.audits["largest-contentful-paint"].numericValue|round),(.audits["total-blocking-time"].numericValue|round),(.audits["cumulative-layout-shift"].numericValue),(.audits["speed-index"].numericValue|round),(.audits["server-response-time"].numericValue|round),$a]|@tsv' "$out" >> perf-results/summary.tsv
            done
          done
          cat perf-results/summary.tsv
          if (( matrix_failures > 0 )); then
            echo "LIGHTHOUSE_MATRIX=FAIL failures=$matrix_failures" >&2
            cat perf-results/failures.tsv >&2
            exit 1
          fi
          echo 'LIGHTHOUSE_MATRIX=PASS failures=0'

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-performance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: perf-results/
          retention-days: 14

  hubspot_e2e:
    name: Production zero-submit HubSpot contract verification
    needs: release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.run_ssh_connectivity_probe &&
      inputs.run_hubspot_e2e &&
      (needs.release.result == 'success' || inputs.deploy == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/staging2/package-lock.json

      - name: Configure verification-only production SSH
        shell: bash
        env:
          NVX_SSH_ALIAS: nvx-prod-hubspot
          NVX_SSH_KEY_BASENAME: prod_hubspot_key
          PRIMARY_HOST: ${{ secrets.PROD_SSH_HOST }}
          PRIMARY_PORT: ${{ secrets.PROD_SSH_PORT }}
          PRIMARY_USER: ${{ secrets.PROD_SSH_USER }}
          PRIMARY_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PRIMARY_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          FALLBACK_HOST: ${{ secrets.STAGING2_SSH_HOST }}
          FALLBACK_PORT: ${{ secrets.STAGING2_SSH_PORT }}
          FALLBACK_USER: ${{ secrets.STAGING2_SSH_USER }}
          FALLBACK_KEY: ${{ secrets.STAGING2_SSH_PRIVATE_KEY }}
          FALLBACK_KNOWN_HOSTS: ${{ secrets.STAGING2_SSH_KNOWN_HOSTS }}
        run: bash scripts/production/configure-siteground-ssh.sh

      - name: Verify zero-submit contract and run HubSpot verification
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          ORIGIN_SSH_ALIAS=nvx-prod-hubspot PROD_DB_NAME="$PROD_DB_NAME" BASE_URL="$BASE_URL" EXPECTED_HOST="$EXPECTED_HOST" EXPECTED_SHA="$EXPECTED_SHA" node scripts/production/verify-production-boundary.mjs
          cd scripts/staging2
          npm ci --ignore-scripts
          cd ../..
          node scripts/staging2/test-hubspot-submission-classifier.mjs
          mkdir -p scripts/staging2/h1-artifacts
          node scripts/staging2/h1-hubspot-e2e.mjs 2>&1 | tee scripts/staging2/h1-artifacts/h1-e2e.log

      - name: Upload H1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h1-hubspot-e2e-evidence-${{ github.run_id }}
          path: scripts/staging2/h1-artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
