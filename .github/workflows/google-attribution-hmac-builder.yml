name: Google Attribution HMAC Builder

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'fix/google-attribution-hmac-relay-20260825'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Apply HMAC relay patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('wp-content/themes/nuvanx-medical/inc/nvx-attribution-integration.php')
          text = path.read_text()

          email_anchor = """function nvx_attribution_email_hash( string $email ): string {\n\t$email = strtolower( trim( $email ) );\n\treturn '' === $email ? '' : hash( 'sha256', $email );\n}\n"""
          helper = email_anchor + """\n/** Resolve the server-only HubSpot credential used to derive the Google relay signing key. */\nfunction nvx_attribution_google_signing_token(): string {\n\tif ( ! defined( 'NVX_HUBSPOT_ACCESS_TOKEN' ) ) {\n\t\treturn '';\n\t}\n\treturn trim( (string) NVX_HUBSPOT_ACCESS_TOKEN );\n}\n\n/** Derive a domain-separated HMAC key dedicated to Google click attribution relay signing. */\nfunction nvx_attribution_google_hmac_key( string $token ): string {\n\t$context = 'nuvanx-google-click-attribution-hmac-key-v1';\n\t$info    = hash_hmac( 'sha256', $context, $token, true );\n\treturn bin2hex( $info );\n}\n\n/** Build authenticated collector headers without exposing the HubSpot token itself. */\nfunction nvx_attribution_collector_signed_headers( string $body, string $origin ): array {\n\t$token = nvx_attribution_google_signing_token();\n\tif ( '' === $token ) {\n\t\treturn array();\n\t}\n\t$timestamp = (string) time();\n\t$hmac_key  = nvx_attribution_google_hmac_key( $token );\n\t$signature = hash_hmac( 'sha256', $timestamp . '.' . $body, $hmac_key );\n\treturn array(\n\t\t'Content-Type'    => 'application/json',\n\t\t'Origin'          => $origin,\n\t\t'x-nvx-timestamp' => $timestamp,\n\t\t'x-nvx-signature' => $signature,\n\t);\n}\n"""
          if email_anchor not in text:
              raise SystemExit('email hash anchor not found')
          text = text.replace(email_anchor, helper, 1)

          response_anchor = """\t$response = wp_remote_post(\n\t\t$endpoint,\n"""
          response_prefix = """\t$collector_headers = nvx_attribution_collector_signed_headers( $collector_body, $origin );\n\tif ( empty( $collector_headers ) ) {\n\t\tnvx_attribution_log_direct_relay( 'FAILURE', 0, 'signing_key_missing' );\n\t\treturn $preempt;\n\t}\n\n\t$response = wp_remote_post(\n\t\t$endpoint,\n"""
          if response_anchor not in text:
              raise SystemExit('collector post anchor not found')
          text = text.replace(response_anchor, response_prefix, 1)

          headers_anchor = """\t\t\t'headers'     => array(\n\t\t\t\t'Content-Type' => 'application/json',\n\t\t\t\t'Origin'       => $origin,\n\t\t\t),\n"""
          if headers_anchor not in text:
              raise SystemExit('collector headers anchor not found')
          text = text.replace(headers_anchor, "\t\t\t'headers'     => $collector_headers,\n", 1)
          path.write_text(text)

          test = Path('scripts/lint/test-attribution-integration-wiring.mjs')
          source = test.read_text()
          needle = "assert.match(integration, /'Origin'\\s*=>\\s*\\$origin/);\n"
          replacement = needle + """assert.match(integration, /nuvanx-google-click-attribution-hmac-key-v1/);\nassert.match(integration, /'x-nvx-timestamp'\\s*=>\\s*\\$timestamp/);\nassert.match(integration, /'x-nvx-signature'\\s*=>\\s*\\$signature/);\nassert.match(integration, /hash_hmac\\( 'sha256', \\$timestamp \\. '\\.' \\. \\$body, \\$hmac_key \\)/);\nassert.match(integration, /signing_key_missing/);\nassert.match(integration, /'headers'\\s*=>\\s*\\$collector_headers/);\n"""
          if needle not in source:
              raise SystemExit('integration test anchor not found')
          test.write_text(source.replace(needle, replacement, 1))
          PY
      - name: Validate PHP syntax
        run: php -l wp-content/themes/nuvanx-medical/inc/nvx-attribution-integration.php
      - name: Run attribution wiring regression
        run: node scripts/lint/test-attribution-integration-wiring.mjs
      - name: Commit validated permanent changes
        shell: bash
        run: |
          set -euo pipefail
          git add wp-content/themes/nuvanx-medical/inc/nvx-attribution-integration.php scripts/lint/test-attribution-integration-wiring.mjs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): sign Google attribution relay requests'
          git push origin HEAD:${{ github.head_ref }}
